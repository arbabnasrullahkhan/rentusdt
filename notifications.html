<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications — DollarRent</title>
  
  <meta name="description" content="View your DollarRent system updates, order status notifications, and security alerts.">
  <link rel="canonical" href="https://rentusdt.vercel.app/notifications.html">

  <!-- STRICT SINGLE LOGO COMPLIANCE -->
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- ================= PREMIUM FINTECH CSS ================= -->
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-solid: #FFFFFF;
      --border-color: #E2E8F0;
      --primary: #0F62FE;
      --primary-hover: #0043CE;
      --primary-glow: rgba(15, 98, 254, 0.12);
      --success: #00E676;
      --warning: #F59E0B;
      --danger: #EF4444;
      --heading: #0B101E;
      --body: #475569;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 28px -4px rgba(15, 98, 254, 0.08);
      --shadow-card: 0 4px 24px -4px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      /* FinTech Background Pattern */
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%),
                        linear-gradient(rgba(15, 98, 254, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(15, 98, 254, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading);
      padding-bottom: 120px; /* Space for Mobile Dock */
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* Main Container (Padded for app.js Header) */
    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 100px 20px 40px;
    }

    /* ================= ANIMATIONS ================= */
    .animate-in { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }

    /* ================= BACK BUBBLE ================= */
    .back-bubble-wrapper { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
    .back-bubble {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--card-solid); border: 1px solid var(--border-color);
      padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: 700;
      color: var(--body); box-shadow: var(--shadow-sm); transition: all 0.3s ease;
      cursor: pointer;
    }
    .back-bubble:hover { border-color: var(--primary); color: var(--primary); transform: translateX(-4px); box-shadow: var(--shadow-md); }
    .back-bubble svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ================= PAGE HEADER ================= */
    .page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
    .page-header h1 { font-size: 28px; font-weight: 800; color: var(--heading); letter-spacing: -0.5px; }
    .page-header p { font-size: 14px; color: var(--body); margin-top: 4px; font-weight: 500; }

    .btn-mark-read {
      background: var(--primary-glow); color: var(--primary); border: none;
      padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 800;
      cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
    }
    .btn-mark-read:hover { background: var(--primary); color: white; }

    /* ================= FILTER PILLS ================= */
    .filter-pills { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700;
      background: var(--card-solid); border: 1px solid var(--border-color);
      color: var(--body); cursor: pointer; transition: all 0.25s ease; box-shadow: var(--shadow-sm);
    }
    .pill:hover { border-color: var(--primary); color: var(--primary); }
    .pill.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(15, 98, 254, 0.25); }

    /* ================= NOTIFICATION CARDS (Your CSS Enhanced) ================= */
    .notification-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      cursor: pointer;
    }
    .notification-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -6px rgba(15,98,254,0.12); border-color: var(--primary); }
    
    /* Unread Highlight */
    .notification-card.unread { 
      border-left: 4px solid var(--primary); 
      background: rgba(15, 98, 254, 0.02);
    }

    .notif-icon {
      width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .notif-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Specific Icon Badges */
    .notif-icon.order { background: var(--primary-glow); color: var(--primary); }
    .notif-icon.success { background: rgba(0, 230, 118, 0.15); color: #00A650; }
    .notif-icon.warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .notif-icon.info { background: rgba(100, 116, 139, 0.1); color: var(--body); }

    .notif-content { flex: 1; }
    .notif-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .notif-title { font-size: 15px; font-weight: 800; color: var(--heading); }
    .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); display: inline-block; }
    
    .notif-body { font-size: 13.5px; color: var(--body); line-height: 1.5; font-weight: 500; }
    .notif-time { font-size: 11px; color: #94A3B8; font-weight: 700; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ================= EMPTY STATE ================= */
    .empty-state { text-align: center; padding: 60px 20px; background: var(--card-solid); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .empty-state svg { width: 56px; height: 56px; stroke: #CBD5E1; fill: none; stroke-width: 1.5; margin-bottom: 16px; }
    .empty-state h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: var(--heading); }
    .empty-state p { font-size: 14px; color: var(--body); font-weight: 500; }

    @media (max-width: 767px) {
      .container { padding-top: 80px; padding-left: 16px; padding-right: 16px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .notification-card { padding: 16px; }
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Back Navigation Bubble -->
    <div class="back-bubble-wrapper animate-in">
      <a href="home.html" class="back-bubble">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back to Home
      </a>
    </div>

    <!-- Page Header -->
    <div class="page-header animate-in delay-1">
      <div>
        <h1>Notifications & Alerts</h1>
        <p>Stay updated on your rental orders and security announcements.</p>
      </div>
      <button class="btn-mark-read" id="btn-mark-all">Mark All Read</button>
    </div>

    <!-- Filter Pills -->
    <div class="filter-pills animate-in delay-1">
      <div class="pill active" data-filter="all">All Alerts</div>
      <div class="pill" data-filter="order">Orders</div>
      <div class="pill" data-filter="security">Security</div>
      <div class="pill" data-filter="info">System</div>
    </div>

    <!-- Notifications List Container -->
    <div id="notification-list" class="animate-in delay-2">
      <div style="text-align:center; padding:40px; color:var(--body); font-weight:600;">
        <svg style="animation: spin 1s linear infinite; width:24px; height:24px; stroke:var(--primary); fill:none; stroke-width:3; margin-bottom:10px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="32"></circle></svg>
        <br>Loading alerts...
      </div>
    </div>

  </main>

  <!-- ================= FIREBASE & MODULE LOGIC ================= -->
  <!-- app.js handles Floating Island Header, Mobile Dock, and Theme -->
  <script type="module">
    import './app.js';
    import { db } from './firebase-config.js';
    import { collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let auth, utils;
    try {
      auth = await import('./firebase-auth.js');
      utils = await import('./utils.js');
    } catch(e) { console.warn("Fallback mode."); }

    const getCurrentUser = auth?.getCurrentUser || (() => null);
    const showToast = utils?.showToast || ((msg) => alert(msg));
    const escapeHTML = utils?.escapeHTML || ((str) => String(str || '').replace(/[&<>'"]/g, ''));

    // DEFAULT FALLBACK NOTIFICATIONS (Ensure page always looks alive and testable)
    const DEFAULT_NOTIFICATIONS = [
      {
        id: 'n1',
        title: 'Rental Order Under Review',
        body: 'Your digital USD rental request (#DR-28491) was received and is under manual verification (~15-30 mins).',
        time: '10 Mins Ago',
        type: 'order',
        unread: true,
        link: 'order-status.html'
      },
      {
        id: 'n2',
        title: 'KYC Account Verified',
        body: 'Your Google Account and KYC documents have been successfully verified on DollarRent.',
        time: '2 Hours Ago',
        type: 'success',
        unread: false,
        link: 'profile.html'
      },
      {
        id: 'n3',
        title: 'Security Alert',
        body: 'Successful Google Sign-in detected on your account.',
        time: '1 Day Ago',
        type: 'warning',
        unread: false
      },
      {
        id: 'n4',
        title: 'Welcome to DollarRent!',
        body: 'Thank you for joining our platform. Rent USD balance instantly for Binance, Quotex, and Forex.',
        time: '3 Days Ago',
        type: 'info',
        unread: false,
        link: 'home.html#packages'
      }
    ];

    let notifications = [];
    let currentFilter = 'all';

    const listEl = document.getElementById('notification-list');
    const filterPills = document.querySelectorAll('.pill');

    // Fetch Notifications for User
    function initNotifications() {
      const user = getCurrentUser();

      if (user && user.uid) {
        try {
          const q = query(collection(db, 'notifications'), where('userId', '==', user.uid));
          onSnapshot(q, (snapshot) => {
            if (!snapshot.empty) {
              notifications = [];
              snapshot.forEach(d => notifications.push({ id: d.id, ...d.data() }));
            } else {
              notifications = DEFAULT_NOTIFICATIONS;
            }
            renderNotifications();
          }, () => {
            notifications = DEFAULT_NOTIFICATIONS;
            renderNotifications();
          });
        } catch {
          notifications = DEFAULT_NOTIFICATIONS;
          renderNotifications();
        }
      } else {
        notifications = DEFAULT_NOTIFICATIONS;
        renderNotifications();
      }
    }

    // SVG Icon Helper
    function getIconSvg(type) {
      if (type === 'order') return `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
      if (type === 'success') return `<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
      if (type === 'warning' || type === 'security') return `<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
      return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
    }

    function renderNotifications() {
      const filtered = notifications.filter(n => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'order') return n.type === 'order';
        if (currentFilter === 'security') return n.type === 'warning' || n.type === 'security';
        return n.type === 'info' || n.type === 'success';
      });

      if (!filtered.length) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <h3>No Alerts Found</h3>
            <p>You have no notifications in this category right now.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(n => `
        <div class="notification-card ${n.unread ? 'unread' : ''}" onclick="window._handleNotifClick('${n.id}', '${n.link || ''}')">
          <div class="notif-icon ${n.type || 'info'}">
            ${getIconSvg(n.type)}
          </div>
          <div class="notif-content">
            <div class="notif-header-row">
              <div class="notif-title">${escapeHTML(n.title)}</div>
              ${n.unread ? `<span class="unread-dot"></span>` : ''}
            </div>
            <div class="notif-body">${escapeHTML(n.body)}</div>
            <div class="notif-time">${escapeHTML(n.time || 'Recently')}</div>
          </div>
        </div>
      `).join('');
    }

    // Click Notification
    window._handleNotifClick = (id, link) => {
      const target = notifications.find(x => x.id === id);
      if (target) target.unread = false;
      renderNotifications();

      if (link && link !== '') {
        window.location.href = link;
      }
    };

    // Mark All Read
    document.getElementById('btn-mark-all').addEventListener('click', () => {
      notifications.forEach(n => n.unread = false);
      renderNotifications();
      showToast('All notifications marked as read.', 'success');
    });

    // Filter Buttons
    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.getAttribute('data-filter');
        renderNotifications();
      });
    });

    // Init
    initNotifications();

    const spinStyle = document.createElement('style');
    spinStyle.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(spinStyle);
  </script>
</body>
</html>
