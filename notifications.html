<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications — DollarRent</title>
  <meta name="description" content="Stay updated with your DollarRent order status changes, promotions, and system announcements.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #F8FAFC; --card-solid: #FFFFFF; --border-color: #E2E8F0;
      --primary: #0F62FE; --primary-glow: rgba(15,98,254,0.12);
      --success: #059669; --warning: #D97706; --danger: #EF4444;
      --heading: #0B101E; --body: #64748B;
      --radius-lg: 24px; --radius-md: 16px; --radius-sm: 12px;
      --shadow-card: 0 4px 24px -4px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(rgba(15,98,254,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,98,254,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading); padding-bottom: 100px; -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 680px; margin: 0 auto; padding: 32px 20px; }

    .animate-in { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 26px; font-weight: 800; }
    .page-header p { font-size: 14px; color: var(--body); margin-top: 4px; }

    .notification-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      gap: 14px;
      transition: all 0.25s ease;
    }
    .notification-card:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -6px rgba(15,98,254,0.1); }
    .notification-card.unread { border-left: 3px solid var(--primary); }

    .notif-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .notif-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .notif-icon.order { background: var(--primary-glow); color: var(--primary); }
    .notif-icon.success { background: rgba(5,150,105,0.1); color: var(--success); }
    .notif-icon.warning { background: rgba(217,119,6,0.1); color: var(--warning); }
    .notif-icon.info { background: rgba(100,116,139,0.08); color: var(--body); }

    .notif-content { flex: 1; }
    .notif-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .notif-body { font-size: 13px; color: var(--body); line-height: 1.5; }
    .notif-time { font-size: 11px; color: #94A3B8; font-weight: 500; margin-top: 6px; }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state svg { width: 56px; height: 56px; stroke: #CBD5E1; fill: none; stroke-width: 1.5; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: var(--body); }
  </style>
</head>
<body>

  <main class="container">
    <div class="page-header animate-in">
      <h1>Notifications</h1>
      <p>Your order updates and system announcements</p>
    </div>
    <div id="notifications-list" class="animate-in delay-1">
      <div style="text-align:center; padding:20px; color:var(--body); font-size:14px;">Loading notifications...</div>
    </div>
  </main>

  <script type="module">
    import './app.js';
    import { getCurrentUser } from './firebase-auth.js';
    import { db } from './firebase-config.js';
    import { collection, query, where, orderBy, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { escapeHTML } from './utils.js';

    const user = getCurrentUser();
    const listEl = document.getElementById('notifications-list');

    async function loadNotifications() {
      if (!user) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <h3>Sign In Required</h3>
            <p>Please sign in to view your notifications.</p>
          </div>`;
        return;
      }

      try {
        // Try fetching notifications from Firestore
        const notifRef = collection(db, 'notifications');
        const q = query(notifRef, where('userId', '==', user.uid), orderBy('createdAt', 'desc'), limit(20));
        const snapshot = await getDocs(q);

        let notifications = [];
        snapshot.forEach(doc => notifications.push({ id: doc.id, ...doc.data() }));

        // Also check order status changes as notifications
        const ordersRef = collection(db, 'orders');
        const oq = query(ordersRef, where('customer.uid', '==', user.uid), orderBy('createdAt', 'desc'), limit(10));
        const orderSnap = await getDocs(oq);

        orderSnap.forEach(doc => {
          const o = doc.data();
          notifications.push({
            id: 'order-' + doc.id,
            type: 'order',
            title: `Order ${o.orderId || doc.id} — ${(o.status || 'submitted').replace('_', ' ').toUpperCase()}`,
            body: `Your $${o.amountUSD || 0} USD package order status has been updated.`,
            createdAt: o.updatedAt || o.createdAt,
            read: true
          });
        });

        // Sort by date
        notifications.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

        renderNotifications(notifications);
      } catch (err) {
        console.warn('Notifications fetch error:', err.message);
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <h3>No Notifications Yet</h3>
            <p>When you place an order, updates will appear here.</p>
          </div>`;
      }
    }

    function renderNotifications(list) {
      if (!list.length) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <h3>All Caught Up!</h3>
            <p>No notifications at this time.</p>
          </div>`;
        return;
      }

      listEl.innerHTML = list.map(n => {
        const iconType = n.type === 'order' ? 'order' : n.type === 'success' ? 'success' : n.type === 'warning' ? 'warning' : 'info';
        const iconSvg = n.type === 'order' ?
          '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>' :
          '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>';

        const timeStr = n.createdAt ? new Date(n.createdAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

        return `
          <div class="notification-card ${n.read ? '' : 'unread'}">
            <div class="notif-icon ${iconType}">${iconSvg}</div>
            <div class="notif-content">
              <div class="notif-title">${escapeHTML(n.title || 'Notification')}</div>
              <div class="notif-body">${escapeHTML(n.body || '')}</div>
              <div class="notif-time">${timeStr}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadNotifications();
  </script>
</body>
</html>
