<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Account — DollarRent</title>
  <meta name="description" content="Manage your DollarRent account, view order history, referral stats, and account settings.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-solid: #FFFFFF;
      --border-color: #E2E8F0;
      --primary: #0F62FE;
      --primary-hover: #0043CE;
      --primary-glow: rgba(15, 98, 254, 0.12);
      --success: #059669;
      --warning: #D97706;
      --danger: #EF4444;
      --heading: #0B101E;
      --body: #64748B;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-card: 0 4px 24px -4px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(rgba(15, 98, 254, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 98, 254, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading);
      padding-bottom: 100px;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    .container { max-width: 680px; margin: 0 auto; padding: 32px 20px; }

    /* Animation */
    .animate-in { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }

    /* Profile Header Card */
    .profile-header {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 24px 32px;
      text-align: center;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .profile-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(135deg, var(--primary), #4A8BFF);
      opacity: 0.06;
    }
    .avatar-ring {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
    }
    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #4A8BFF);
      z-index: 0;
    }
    .avatar {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--card-solid);
      z-index: 1;
      background: var(--bg-color);
    }
    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--heading);
      margin-bottom: 4px;
    }
    .profile-email {
      font-size: 14px;
      color: var(--body);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .member-since {
      font-size: 12px;
      color: var(--body);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-color);
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 8px;
    }

    /* Quick Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0 0;
    }
    .stat-item {
      background: var(--bg-color);
      border-radius: var(--radius-sm);
      padding: 14px 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--body);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .action-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .action-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(15, 98, 254, 0.12);
      border-color: rgba(15, 98, 254, 0.2);
    }
    .action-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .action-label { font-size: 14px; font-weight: 700; color: var(--heading); }
    .action-desc { font-size: 12px; color: var(--body); font-weight: 500; }

    /* Order History */
    .section-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      margin-top: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title svg { width: 20px; height: 20px; stroke: var(--primary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }
    .order-item:last-child { border-bottom: none; }
    .order-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .order-icon svg { width: 18px; height: 18px; stroke: var(--primary); fill: none; stroke-width: 2; }
    .order-info { flex: 1; }
    .order-pkg { font-size: 14px; font-weight: 700; }
    .order-ref { font-size: 12px; color: var(--body); font-weight: 500; }
    .order-right { text-align: right; }
    .order-fee { font-size: 14px; font-weight: 800; color: var(--primary); }
    .order-track { font-size: 12px; font-weight: 600; color: var(--success); cursor: pointer; }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-submitted { background: rgba(15, 98, 254, 0.1); color: var(--primary); }
    .badge-under_review { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
    .badge-approved { background: rgba(5, 150, 105, 0.1); color: var(--success); }
    .badge-rejected { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .badge-delivered { background: rgba(5, 150, 105, 0.15); color: var(--success); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    .empty-state svg { width: 48px; height: 48px; stroke: #CBD5E1; fill: none; stroke-width: 1.5; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; color: var(--body); font-weight: 500; }
    .empty-state a { display: inline-block; margin-top: 12px; background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; }

    /* Logout Button */
    .btn-logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: rgba(239, 68, 68, 0.06);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.12); }
    .btn-logout svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Not Logged In */
    .login-prompt {
      text-align: center;
      padding: 60px 20px;
    }
    .login-prompt h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .login-prompt p { font-size: 14px; color: var(--body); margin-bottom: 24px; }
    .btn-google-login {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 98, 254, 0.25);
      transition: all 0.25s ease;
    }
    .btn-google-login:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15, 98, 254, 0.35); }
    .btn-google-login svg { width: 20px; height: 20px; }

    @media (max-width: 480px) {
      .quick-actions { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-value { font-size: 18px; }
    }
  </style>
</head>
<body>

  <main class="container" id="profile-container">
    <!-- Content rendered by JS based on auth state -->
  </main>

  <script type="module">
    import './app.js';
    import { getCurrentUser, loginWithGoogle, logoutUser, initAuthObserver } from './firebase-auth.js';
    import { db } from './firebase-config.js';
    import { collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { formatUSD, escapeHTML } from './utils.js';

    const container = document.getElementById('profile-container');

    function renderProfile(user) {
      if (!user) {
        container.innerHTML = `
          <div class="login-prompt animate-in">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <h2>Sign In to Your Account</h2>
            <p>Access your order history, referral dashboard, and account settings.</p>
            <button id="btn-google-signin" class="btn-google-login">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
              Continue with Google
            </button>
          </div>
        `;
        document.getElementById('btn-google-signin')?.addEventListener('click', async () => {
          try {
            const userData = await loginWithGoogle();
            if (userData) renderProfile(userData);
          } catch(e) { /* handled in auth module */ }
        });
        return;
      }

      const initials = (user.fullName || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      const memberDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : 'Member';

      container.innerHTML = `
        <!-- Profile Header -->
        <div class="profile-header animate-in delay-1">
          <div class="avatar-ring">
            <img id="user-avatar" class="avatar" src="${user.photoURL || ''}" alt="${escapeHTML(user.fullName || 'User')}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div style="display:none; position:relative; z-index:1; width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg, var(--primary), #4A8BFF); color:white; font-size:28px; font-weight:800; align-items:center; justify-content:center; border:4px solid var(--card-solid);">${initials}</div>
          </div>
          <h2 class="profile-name">${escapeHTML(user.fullName || 'DollarRent User')}</h2>
          <p class="profile-email">${escapeHTML(user.email || '')}</p>
          <div class="member-since">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Member since ${memberDate}
          </div>

          <div class="stats-row" id="stats-row">
            <div class="stat-item">
              <div class="stat-value" id="stat-total">—</div>
              <div class="stat-label">Orders</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="stat-approved" style="color:var(--success);">—</div>
              <div class="stat-label">Completed</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="stat-spent">—</div>
              <div class="stat-label">Fees Paid</div>
            </div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions animate-in delay-2">
          <a href="home.html#packages" class="action-card">
            <div class="action-icon" style="background:rgba(15,98,254,0.08); color:var(--primary);">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <div>
              <div class="action-label">Rent USD</div>
              <div class="action-desc">Browse packages</div>
            </div>
          </a>
          <a href="referral.html" class="action-card">
            <div class="action-icon" style="background:rgba(5,150,105,0.08); color:var(--success);">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </div>
            <div>
              <div class="action-label">Referrals</div>
              <div class="action-desc">Earn rewards</div>
            </div>
          </a>
          <a href="notifications.html" class="action-card">
            <div class="action-icon" style="background:rgba(217,119,6,0.08); color:var(--warning);">
              <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <div>
              <div class="action-label">Notifications</div>
              <div class="action-desc">Updates & alerts</div>
            </div>
          </a>
          <a href="faq.html" class="action-card">
            <div class="action-icon" style="background:rgba(100,116,139,0.08); color:var(--body);">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </div>
            <div>
              <div class="action-label">Help & FAQ</div>
              <div class="action-desc">Get answers</div>
            </div>
          </a>
        </div>

        <!-- Order History -->
        <div class="section-card animate-in delay-3">
          <div class="section-title">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Order History
          </div>
          <div id="order-history-list">
            <div style="text-align:center; padding:20px; color:var(--body); font-size:14px;">Loading orders...</div>
          </div>
        </div>

        <!-- Sign Out -->
        <button id="btn-logout-user" class="btn-logout animate-in delay-4">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sign Out
        </button>
      `;

      // Bind logout
      document.getElementById('btn-logout-user')?.addEventListener('click', async () => {
        await logoutUser();
        window.location.href = 'home.html';
      });

      // Load order history from Firestore
      loadOrderHistory(user.uid);
    }

    async function loadOrderHistory(uid) {
      const listEl = document.getElementById('order-history-list');
      if (!listEl) return;

      try {
        const ordersRef = collection(db, 'orders');
        const q = query(ordersRef, where('customer.uid', '==', uid), orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);

        let orders = [];
        snapshot.forEach(doc => {
          orders.push({ id: doc.id, ...doc.data() });
        });

        // Update stats
        const statTotal = document.getElementById('stat-total');
        const statApproved = document.getElementById('stat-approved');
        const statSpent = document.getElementById('stat-spent');

        if (statTotal) statTotal.textContent = orders.length;
        if (statApproved) statApproved.textContent = orders.filter(o => o.status === 'approved' || o.status === 'delivered').length;
        if (statSpent) statSpent.textContent = formatUSD(orders.reduce((acc, o) => acc + (o.fee || 0), 0));

        if (orders.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              <p>You haven't placed any orders yet.</p>
              <a href="home.html#packages">Browse Packages →</a>
            </div>
          `;
          return;
        }

        listEl.innerHTML = orders.map(o => `
          <div class="order-item">
            <div class="order-icon">
              <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
            <div class="order-info">
              <div class="order-pkg">$${o.amountUSD || 0} USD Package</div>
              <div class="order-ref">${escapeHTML(o.orderId || o.id)} · <span class="status-badge badge-${o.status}">${(o.status || 'submitted').replace('_', ' ')}</span></div>
            </div>
            <div class="order-right">
              <div class="order-fee">${formatUSD(o.fee || 0)}</div>
              <a href="order-status.html?orderId=${o.orderId || o.id}" class="order-track">Track →</a>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.warn('Order history fetch error:', err.message);
        // Fallback: try localStorage
        try {
          const localOrders = JSON.parse(localStorage.getItem('dollarrent_demo_orders') || '[]');
          const statTotal = document.getElementById('stat-total');
          if (statTotal) statTotal.textContent = localOrders.length;

          if (localOrders.length === 0) {
            listEl.innerHTML = `
              <div class="empty-state">
                <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                <p>No orders found. Start by renting a package.</p>
                <a href="home.html#packages">Browse Packages →</a>
              </div>
            `;
          } else {
            listEl.innerHTML = localOrders.map(o => `
              <div class="order-item">
                <div class="order-icon">
                  <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                </div>
                <div class="order-info">
                  <div class="order-pkg">$${o.amountUSD || 0} USD Package</div>
                  <div class="order-ref">${o.orderId || o.id}</div>
                </div>
                <div class="order-right">
                  <div class="order-fee">${formatUSD(o.fee || 0)}</div>
                  <a href="order-status.html?orderId=${o.orderId || o.id}" class="order-track">Track →</a>
                </div>
              </div>
            `).join('');
          }
        } catch { listEl.innerHTML = '<p style="text-align:center; color:var(--body);">Unable to load orders.</p>'; }
      }
    }

    // Initial render
    const user = getCurrentUser();
    renderProfile(user);

    // Auth observer for live updates
    initAuthObserver((updatedUser) => {
      if (!updatedUser && !getCurrentUser()) {
        renderProfile(null);
      }
    });
  </script>
</body>
</html>
