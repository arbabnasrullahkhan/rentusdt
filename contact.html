<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact Us — DollarRent</title>
  <meta name="description" content="Contact DollarRent support team via Telegram for any questions about digital USD rentals, orders, or payments.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #F8FAFC; --card-solid: #FFFFFF; --border-color: #E2E8F0;
      --primary: #0F62FE; --primary-glow: rgba(15,98,254,0.12);
      --heading: #0B101E; --body: #64748B;
      --radius-lg: 24px; --radius-md: 16px; --shadow-card: 0 4px 24px -4px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%);
      color: var(--heading); padding-bottom: 100px; -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 680px; margin: 0 auto; padding: 32px 20px; }

    .animate-in { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.15s; }
    .delay-3 { animation-delay: 0.2s; }

    .page-header { text-align: center; margin-bottom: 32px; }
    .page-header h1 { font-size: 30px; font-weight: 800; }
    .page-header p { font-size: 15px; color: var(--body); margin-top: 6px; }

    .contact-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .contact-card {
      background: var(--card-solid); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 24px;
      box-shadow: var(--shadow-card); text-align: center;
      transition: all 0.25s ease; cursor: pointer;
    }
    .contact-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -6px rgba(15,98,254,0.12); }
    .contact-card svg { width: 32px; height: 32px; margin-bottom: 10px; }
    .contact-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .contact-card p { font-size: 13px; color: var(--body); }

    .form-card {
      background: var(--card-solid); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 28px 24px;
      box-shadow: var(--shadow-card);
    }
    .form-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--heading); margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border-color); border-radius: var(--radius-sm, 12px);
      font-size: 14px; font-family: inherit; color: var(--heading);
      background: var(--bg-color); outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary), #0043CE); color: white;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 20px rgba(15,98,254,0.25);
      transition: all 0.25s ease;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,98,254,0.35); }

    @media (max-width: 480px) { .contact-cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <main class="container">
    <div class="page-header animate-in">
      <h1>Contact Us</h1>
      <p>We're here to help. Reach out through any of the channels below.</p>
    </div>

    <div class="contact-cards animate-in delay-1">
      <a href="https://t.me/RENTAL_DOLLOR" target="_blank" class="contact-card">
        <svg viewBox="0 0 24 24" fill="#0088cc"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        <h3>Telegram</h3>
        <p>@RENTAL_DOLLOR (24/7)</p>
      </a>
      <a href="mailto:support@dollarrent.com" class="contact-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <h3>Email</h3>
        <p>support@dollarrent.com</p>
      </a>
    </div>

    <div class="form-card animate-in delay-2">
      <h2>Send Us a Message</h2>
      <form id="contact-form">
        <div class="form-group">
          <label for="contact-name">Your Name</label>
          <input type="text" id="contact-name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="contact-email">Email Address</label>
          <input type="email" id="contact-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="contact-subject">Subject</label>
          <input type="text" id="contact-subject" placeholder="How can we help?" required>
        </div>
        <div class="form-group">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" placeholder="Describe your question or issue..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </main>

  <script type="module">
    import './app.js';
    import { db } from './firebase-config.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { showToast } from './utils.js';
    import { getCurrentUser } from './firebase-auth.js';

    const user = getCurrentUser();
    if (user) {
      const nameInput = document.getElementById('contact-name');
      const emailInput = document.getElementById('contact-email');
      if (nameInput && user.fullName) nameInput.value = user.fullName;
      if (emailInput && user.email) emailInput.value = user.email;
    }

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const data = {
        name: document.getElementById('contact-name').value,
        email: document.getElementById('contact-email').value,
        subject: document.getElementById('contact-subject').value,
        message: document.getElementById('contact-message').value,
        createdAt: new Date().toISOString(),
        userId: user?.uid || null
      };

      try {
        await addDoc(collection(db, 'contact_messages'), data);
        showToast('Message sent successfully! We\'ll get back to you soon.', 'success');
        e.target.reset();
      } catch (err) {
        showToast('Message saved. For faster support, contact us on Telegram.', 'info');
      }

      btn.disabled = false;
      btn.textContent = 'Send Message';
    });
  </script>
</body>
</html>
