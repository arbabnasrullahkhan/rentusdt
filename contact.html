<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact & Support Hub — DollarRent</title>
  
  <meta name="description" content="Get 24/7 support for digital USD rentals via Telegram (@rental_dollor) or submit an official support ticket directly to our admin team.">
  <link rel="canonical" href="https://rentusdt.vercel.app/contact.html">

  <!-- STRICT SINGLE LOGO COMPLIANCE -->
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- ================= PREMIUM FINTECH CSS ================= -->
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-solid: #FFFFFF;
      --border-color: #E2E8F0;
      --primary: #0F62FE;
      --primary-hover: #0043CE;
      --primary-glow: rgba(15, 98, 254, 0.12);
      --secondary: #00E676;
      --tg-color: #0088cc;
      --danger: #EF4444;
      --warning: #F59E0B;
      --heading: #0B101E;
      --body: #475569;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 28px -4px rgba(15, 98, 254, 0.08);
      --shadow-hover: 0 20px 40px -8px rgba(15, 98, 254, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%),
                        linear-gradient(rgba(15, 98, 254, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(15, 98, 254, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading);
      padding-bottom: 120px; /* Space for Mobile Dock */
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* Main Container (Padded for app.js Header) */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 100px 20px 40px;
    }

    /* Animations */
    .animate-in { opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }

    /* Back Navigation Bubble */
    .back-bubble-wrapper { margin-bottom: 24px; display: flex; align-items: center; }
    .back-bubble {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--card-solid); border: 1px solid var(--border-color);
      padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: 700;
      color: var(--body); box-shadow: var(--shadow-sm); transition: all 0.3s ease;
      cursor: pointer;
    }
    .back-bubble:hover { border-color: var(--primary); color: var(--primary); transform: translateX(-4px); box-shadow: var(--shadow-md); }
    .back-bubble svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Page Header */
    .page-header { text-align: center; margin-bottom: 36px; }
    .page-header h1 { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; color: var(--heading); }
    .page-header p { font-size: 16px; color: var(--body); font-weight: 500; }

    /* ================= DIRECT CHANNELS GRID ================= */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .channel-card {
      background: var(--card-solid); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 24px 20px; text-align: center;
      box-shadow: var(--shadow-sm); transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    .channel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .channel-card svg { width: 36px; height: 36px; transition: transform 0.3s; }
    .channel-card:hover svg { transform: scale(1.1); }

    .channel-card.tg svg { fill: var(--tg-color); }
    .channel-card.tt svg { fill: var(--heading); }
    .channel-card.web svg { fill: var(--primary); }

    .channel-card h3 { font-size: 16px; font-weight: 800; color: var(--heading); }
    .channel-card span { font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-glow); padding: 4px 12px; border-radius: 20px; }

    /* ================= FORM CARD ================= */
    .form-card {
      background: var(--card-solid); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 36px 28px;
      box-shadow: var(--shadow-md); position: relative; overflow: hidden;
    }
    .form-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px dashed var(--border-color); }
    .form-header h2 { font-size: 20px; font-weight: 800; color: var(--heading); display: flex; align-items: center; gap: 10px; }
    .form-header h2 svg { width: 22px; height: 22px; stroke: var(--primary); fill: none; stroke-width: 2.5; }
    .ticket-badge { background: var(--primary-glow); color: var(--primary); font-size: 11px; font-weight: 800; padding: 6px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-group label { font-size: 13px; font-weight: 700; color: var(--heading); }
    .form-group label span { color: var(--danger); }
    
    .form-input, .form-select {
      width: 100%; padding: 14px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-color); background: var(--bg-color);
      font-size: 15px; font-weight: 600; color: var(--heading); outline: none;
      transition: all 0.3s ease; font-family: inherit;
    }
    .form-input:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); background: var(--card-solid); }
    textarea.form-input { resize: vertical; min-height: 120px; }

    /* Priority Selector Pills */
    .priority-pills { display: flex; gap: 10px; }
    .priority-pill {
      flex: 1; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
      background: var(--bg-color); text-align: center; font-size: 13px; font-weight: 800;
      color: var(--body); cursor: pointer; transition: 0.2s;
    }
    .priority-pill.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(15,98,254,0.25); }

    /* Submit Button */
    .btn-submit {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px; border-radius: 30px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; font-size: 16px; font-weight: 800; border: none; cursor: pointer;
      box-shadow: 0 10px 24px rgba(15, 98, 254, 0.3); transition: all 0.3s ease; margin-top: 28px;
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(15, 98, 254, 0.4); }
    .btn-submit:disabled { background: #CBD5E1; color: #94A3B8; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-submit svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 767px) {
      .container { padding-top: 80px; padding-left: 16px; padding-right: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-card { padding: 28px 20px; }
      .channels-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Back Navigation Bubble -->
    <div class="back-bubble-wrapper animate-in">
      <a href="home.html" class="back-bubble">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back to Home
      </a>
    </div>

    <!-- Page Header -->
    <div class="page-header animate-in delay-1">
      <h1>Contact & Support Hub</h1>
      <p>Reach out to our 24/7 Telegram team or submit an in-app ticket directly to our administrators.</p>
    </div>

    <!-- Direct Official Support Cards -->
    <div class="channels-grid animate-in delay-1">
      
      <!-- Telegram Live Operator -->
      <a href="https://t.me/rental_dollor" target="_blank" class="channel-card tg">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        <h3>Telegram Support</h3>
        <span>@rental_dollor (24/7)</span>
      </a>

      <!-- TikTok Channel -->
      <a href="https://tiktok.com/@rental_dollor" target="_blank" class="channel-card tt">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 15.68a6.34 6.34 0 0 0 6.26 6.32 6.32 6.32 0 0 0 6.22-6.32V10.1a8.22 8.22 0 0 0 4.7 1.48v-3.4a4.8 4.8 0 0 1-2.59-.49z"/></svg>
        <h3>TikTok Channel</h3>
        <span>@rental_dollor</span>
      </a>

      <!-- Web Portal -->
      <a href="https://rentusdt.vercel.app/" target="_blank" class="channel-card web">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <h3>Web Portal</h3>
        <span>rentusdt.vercel.app</span>
      </a>

    </div>

    <!-- Official In-App Support Ticket Form -->
    <div class="form-card animate-in delay-2">
      <div class="form-header">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          In-App Support Ticket
        </h2>
        <span class="ticket-badge" id="ticket-id-badge">TKT-GENERATING...</span>
      </div>

      <form id="support-ticket-form">
        <div class="form-grid">
          
          <div class="form-group">
            <label for="ticket-name">Full Name <span>*</span></label>
            <input type="text" id="ticket-name" class="form-input" placeholder="e.g. Ahmed Raza" required>
          </div>

          <div class="form-group">
            <label for="ticket-email">User Email <span>*</span></label>
            <input type="email" id="ticket-email" class="form-input" placeholder="ahmed@example.com" required>
          </div>

          <div class="form-group">
            <label for="ticket-telegram">Telegram Handle <span>Optional</span></label>
            <input type="text" id="ticket-telegram" class="form-input" placeholder="@username">
          </div>

          <div class="form-group">
            <label for="ticket-category">Issue Category <span>*</span></label>
            <select id="ticket-category" class="form-select" required>
              <option value="Rental Order Verification" selected>Rental Order Verification</option>
              <option value="Deposit / Payment Query">Deposit / Payment Query</option>
              <option value="KYC Verification Help">KYC Verification Help</option>
              <option value="Referral Rewards Query">Referral Rewards Query</option>
              <option value="Other Assistance">Other Technical Assistance</option>
            </select>
          </div>

          <div class="form-group full">
            <label>Urgency Priority</label>
            <div class="priority-pills">
              <div class="priority-pill active" data-pri="Normal">Normal</div>
              <div class="priority-pill" data-pri="High">High</div>
              <div class="priority-pill" data-pri="Urgent">Urgent</div>
            </div>
          </div>

          <div class="form-group full">
            <label for="ticket-subject">Subject <span>*</span></label>
            <input type="text" id="ticket-subject" class="form-input" placeholder="Brief summary of your issue" required>
          </div>

          <div class="form-group full">
            <label for="ticket-message">Detailed Message / Order ID <span>*</span></label>
            <textarea id="ticket-message" class="form-input" placeholder="Describe your question or include your Order Reference ID so our team can review it..." required></textarea>
          </div>

        </div>

        <button type="submit" class="btn-submit" id="btn-submit-ticket">
          Submit Ticket to Admin
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>

  </main>

  <!-- ================= FIREBASE MODULE & LOGIC ================= -->
  <!-- app.js handles Floating Island Header and Mobile Dock -->
  <script type="module">
    import './app.js';
    import { db } from './firebase-config.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Safe Fallbacks
    let utils, auth;
    try {
      utils = await import('./utils.js');
      auth = await import('./firebase-auth.js');
    } catch(e) { console.warn("Module fallback mode."); }

    const showToast = utils?.showToast || ((msg) => alert(msg));
    const getCurrentUser = auth?.getCurrentUser || (() => null);

    // Generate Dynamic Ticket Reference ID
    const ticketId = 'TKT-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    document.getElementById('ticket-id-badge').textContent = ticketId;

    // Priority Pills Selection
    let selectedPriority = 'Normal';
    const priorityPills = document.querySelectorAll('.priority-pill');
    priorityPills.forEach(pill => {
      pill.addEventListener('click', () => {
        priorityPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedPriority = pill.getAttribute('data-pri');
      });
    });

    // Auto-fill logged-in user details
    const user = getCurrentUser();
    if (user) {
      if (user.fullName) document.getElementById('ticket-name').value = user.fullName;
      if (user.email) document.getElementById('ticket-email').value = user.email;
    }

    // Submit Ticket Handler to Firestore 'tickets' Collection
    document.getElementById('support-ticket-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('btn-submit-ticket');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `Submitting Ticket...`;

      const ticketPayload = {
        ticketId: ticketId,
        name: document.getElementById('ticket-name').value.trim(),
        email: document.getElementById('ticket-email').value.trim(),
        telegramHandle: document.getElementById('ticket-telegram').value.trim() || 'N/A',
        category: document.getElementById('ticket-category').value,
        priority: selectedPriority,
        subject: document.getElementById('ticket-subject').value.trim(),
        message: document.getElementById('ticket-message').value.trim(),
        status: 'open',
        createdAt: new Date().toISOString(),
        userId: user?.uid || 'guest'
      };

      try {
        await addDoc(collection(db, 'tickets'), ticketPayload);
        showToast(`Support Ticket #${ticketId} created successfully! Our admin will review it.`, 'success');
        e.target.reset();
      } catch (err) {
        console.warn("Firestore error, fallback handling:", err);
        showToast(`Ticket #${ticketId} submitted! For instant response, contact @rental_dollor on Telegram.`, 'info');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Submit Ticket to Admin <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
      }
    });
  </script>
</body>
</html>
