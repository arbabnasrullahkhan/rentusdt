<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login — DollarRent</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- STRICT LOGO COMPLIANCE -->
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/logo.png">

  <!-- ================= PREMIUM FINTECH CSS ================= -->
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-solid: #FFFFFF;
      --border-color: #E2E8F0;
      --primary: #0F62FE;
      --primary-hover: #0043CE;
      --primary-glow: rgba(15, 98, 254, 0.12);
      --secondary: #00E676;
      --danger: #EF4444;
      --heading: #0B101E;
      --body: #475569;
      --radius-lg: 28px;
      --radius-md: 18px;
      --shadow-md: 0 20px 48px -12px rgba(15, 98, 254, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      /* FinTech Background Pattern */
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 75%), 
                        linear-gradient(rgba(15, 98, 254, 0.03) 1px, transparent 1px), 
                        linear-gradient(90deg, rgba(15, 98, 254, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
      position: relative; overflow: hidden;
    }

    /* Ambient Light Orbs */
    .bg-blob {
      position: absolute; border-radius: 50%; filter: blur(90px);
      opacity: 0.45; pointer-events: none; z-index: 1;
      animation: floatBlob 8s ease-in-out infinite alternate;
    }
    .blob-1 { width: 300px; height: 300px; background: rgba(15, 98, 254, 0.25); top: -10%; left: -10%; }
    .blob-2 { width: 320px; height: 320px; background: rgba(0, 230, 118, 0.2); bottom: -10%; right: -10%; animation-delay: -4s; }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.15); }
    }

    .login-container {
      max-width: 440px; width: 100%;
      position: relative; z-index: 10;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      box-shadow: var(--shadow-md);
      text-align: center;
      transform: translateY(20px); opacity: 0;
      animation: springIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes springIn { to { transform: translateY(0); opacity: 1; } }

    /* Logo Glow Box */
    .logo-wrapper {
      position: relative; width: 80px; height: 80px; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-wrapper::before {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      background: var(--primary-glow); filter: blur(10px); animation: pulseGlow 3s infinite ease-in-out;
    }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.1); } }

    .login-logo {
      width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2;
      filter: drop-shadow(0 8px 16px rgba(15,98,254,0.25));
    }

    .login-card h1 {
      font-size: 28px; font-weight: 900; letter-spacing: -0.8px; margin-bottom: 6px; color: var(--heading);
    }
    .login-card h1 span { color: var(--primary); }
    .login-card p {
      font-size: 14.5px; color: var(--body); margin-bottom: 32px; font-weight: 500; line-height: 1.5;
    }

    /* Google Admin Button */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; border: none; border-radius: 30px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 24px rgba(15,98,254,0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-google:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(15,98,254,0.4); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-google svg { width: 22px; height: 22px; fill: currentColor; }

    .security-note {
      margin-top: 24px; font-size: 12.5px; color: var(--body); font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .security-note svg { width: 16px; height: 16px; stroke: var(--primary); fill: none; stroke-width: 2.2; flex-shrink: 0; }

    .error-msg {
      margin-top: 20px; padding: 14px 18px;
      background: rgba(239, 68, 68, 0.08); color: #B91C1C;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700;
      display: none; line-height: 1.5; text-align: left;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px; justify-content: center;
      margin-top: 24px; font-size: 14px; color: var(--body); font-weight: 700;
      transition: all 0.2s ease; width: 100%;
    }
    .back-link:hover { color: var(--primary); transform: translateX(-3px); }

    @media (max-width: 480px) {
      .login-card { padding: 36px 20px; }
      .login-card h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-wrapper">
        <img src="../assets/logo.png" class="login-logo" alt="DollarRent Admin">
      </div>
      
      <h1>Dollar<span>Admin</span></h1>
      <p>Authorized personnel only. Authenticate with your administrative Google account.</p>

      <button id="btn-admin-login" class="btn-google">
        <svg viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
        Sign In with Google
      </button>

      <!-- Dynamic Error Box -->
      <div class="error-msg" id="error-msg"></div>

      <div class="security-note">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Secured with Firebase Role Verification
      </div>
    </div>

    <a href="../home.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back to DollarRent Platform
    </a>
  </div>

  <!-- ================= FIREBASE & AUTH LOGIC ================= -->
  <script type="module">
    import { loginAdminWithGoogle, getAdminUser } from '../firebase-auth.js';
    import { showToast } from '../utils.js';

    // If already authenticated as Admin, redirect immediately to Dashboard
    const admin = getAdminUser();
    if (admin) {
      window.location.href = 'dashboard.html';
    }

    const loginBtn = document.getElementById('btn-admin-login');
    const errorEl = document.getElementById('error-msg');

    loginBtn.addEventListener('click', async () => {
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<svg style="animation: spin 0.8s linear infinite;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="32" fill="none" stroke="currentColor" stroke-width="3"></circle></svg> Authenticating...`;
      errorEl.style.display = 'none';

      try {
        await loginAdminWithGoogle();
        showToast('Superadmin access granted!', 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);

      } catch (err) {
        console.error("Admin Auth Error:", err);
        errorEl.textContent = err.message || 'Access denied. Your account is not authorized as Superadmin.';
        errorEl.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg> Sign In with Google`;
      }
    });

    // Spin Keyframe
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
