<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login — DollarRent</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <style>
    :root {
      --bg-color: #F1F5F9; --card: #FFFFFF; --border: #E2E8F0;
      --primary: #0F62FE; --heading: #0B101E; --body: #64748B;
      --radius-lg: 24px; --radius-md: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: var(--bg-color);
      color: var(--heading);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; -webkit-font-smoothing: antialiased;
    }
    .login-container {
      max-width: 420px; width: 100%;
      opacity: 0; transform: translateY(20px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .login-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px 32px;
      box-shadow: 0 12px 40px -10px rgba(0,0,0,0.08);
      text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px; margin: 0 auto 16px;
      filter: drop-shadow(0 6px 12px rgba(15,98,254,0.15));
    }
    .login-card h1 {
      font-size: 24px; font-weight: 800; margin-bottom: 6px;
    }
    .login-card h1 span { color: var(--primary); }
    .login-card p {
      font-size: 14px; color: var(--body); margin-bottom: 28px;
    }

    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px;
      background: var(--primary); color: white;
      border: none; border-radius: var(--radius-md);
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 24px rgba(15,98,254,0.3);
      transition: all 0.25s ease;
    }
    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(15,98,254,0.4); }
    .btn-google:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-google svg { width: 20px; height: 20px; }

    .security-note {
      margin-top: 20px; font-size: 12px; color: var(--body);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .security-note svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    .error-msg {
      margin-top: 16px; padding: 12px;
      background: rgba(239,68,68,0.08); color: #DC2626;
      border-radius: 12px; font-size: 13px; font-weight: 600;
      display: none;
    }

    .back-link {
      display: block; text-align: center;
      margin-top: 20px; font-size: 13px;
      color: var(--body); font-weight: 600;
    }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img src="../assets/logo.png" class="login-logo" alt="DollarRent Admin">
      <h1>Dollar<span>Admin</span></h1>
      <p>Authorized personnel only. Sign in with your admin Google account.</p>

      <button id="btn-admin-login" class="btn-google">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
        Sign In with Google
      </button>

      <div class="error-msg" id="error-msg"></div>

      <div class="security-note">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Secured with Firebase Authentication & Role Verification
      </div>
    </div>

    <a href="../home.html" class="back-link">← Back to DollarRent</a>
  </div>

  <script type="module">
    import { loginAdminWithGoogle, getAdminUser } from '../firebase-auth.js';
    import { showToast } from '../utils.js';

    // If already authenticated, redirect to dashboard
    const admin = getAdminUser();
    if (admin) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('btn-admin-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-admin-login');
      const errorEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;"></div> Authenticating...';
      errorEl.style.display = 'none';

      try {
        await loginAdminWithGoogle();
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Access denied. Your account is not authorized.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg> Sign In with Google';
      }
    });

    // Add spin animation
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
