<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Users — DollarRent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <style>
    :root {
      --bg: #F5F5F7; --card: rgba(255, 255, 255, 0.7); --border: rgba(226, 232, 240, 0.6);
      --primary: #0066CC; --primary-hover: #0055AA; --primary-glow: rgba(0, 102, 204, 0.1);
      --success: #34C759; --warning: #FF9500; --danger: #FF3B30;
      --heading: #1D1D1F; --body: #86868B;
      --radius: 24px; --radius-sm: 16px;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: var(--bg); color: var(--heading);
      display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { text-decoration: none; color: inherit; }

    /* ===== SIDEBAR (Desktop) / BOTTOM DOCK (Mobile) ===== */
    .sidebar {
      width: var(--sidebar-w); background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column;
      justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0;
      z-index: 100; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 36px; }
    .sidebar-brand img { width: 36px; height: 36px; filter: drop-shadow(0 4px 8px rgba(0,102,204,0.3)); }
    .sidebar-brand span { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .sidebar-brand span b { color: var(--primary); }

    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu a {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; color: var(--body); transition: all 0.25s ease;
    }
    .sidebar-menu a:hover { background: var(--primary-glow); color: var(--primary); transform: translateX(4px); }
    .sidebar-menu a.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(0,102,204,0.3); }
    .sidebar-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-footer { padding: 0 12px; }
    .sidebar-footer a { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--body); padding: 12px 0; }
    .sidebar-footer a:hover { color: var(--danger); }
    .sidebar-footer svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ===== MAIN ===== */
    .main { flex: 1; margin-left: var(--sidebar-w); padding: 40px 48px; overflow-y: auto; min-width: 0; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .page-header p { font-size: 15px; color: var(--body); margin-top: 4px; font-weight: 500; }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .search-input { padding: 12px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 15px; width: 320px; outline: none; background: var(--card); backdrop-filter: blur(10px); transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }
    
    .table-card { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); overflow: hidden; }
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 800px; }
    th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 800; color: var(--body); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
    td { padding: 16px; font-size: 15px; font-weight: 500; border-bottom: 1px solid rgba(226,232,240,0.5); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(0,102,204,0.03); }

    .badge { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .badge-active { background: rgba(52,199,89,0.1); color: var(--success); }
    .badge-banned { background: rgba(255,59,48,0.1); color: var(--danger); }

    .action-btns { display: flex; gap: 8px; }
    .btn-action { padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-ban { background: rgba(255,59,48,0.1); color: var(--danger); }
    .btn-ban:hover { background: rgba(255,59,48,0.2); }
    
    .empty-row td { text-align: center; color: var(--body); padding: 40px; }

    /* Mobile Dock */
    .mobile-dock { display: none; }

    @media (max-width: 1024px) {
      .main { padding: 32px; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 16px 100px; }
      .filter-bar { flex-direction: column; }
      .search-input { width: 100%; }
      .page-header h1 { font-size: 26px; }
      .table-card { padding: 16px; }
      
      .mobile-dock {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 16px; left: 16px; right: 16px;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(229, 231, 235, 0.7); border-radius: 30px;
        padding: 10px 16px; z-index: 10000; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.15);
      }
      .mobile-dock a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--body); font-size: 10px; font-weight: 700; gap: 4px; flex: 1; transition: all 0.2s ease; }
      .mobile-dock a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; transition: all 0.3s; }
      .mobile-dock a.active { color: var(--primary); }
      .mobile-dock a.active svg { transform: translateY(-2px); stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(0,102,204,0.4)); }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><img src="../assets/logo.png" alt="DollarRent"><span>Dollar<b>Admin</b></span></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a></li>
        <li><a href="orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> Orders</a></li>
        <li><a href="packages.html"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Packages</a></li>
        <li><a href="payment-methods.html"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect></svg> Payments</a></li>
        <li><a href="users.html" class="active"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> Users</a></li>
        <li><a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg> Settings</a></li>
      </ul>
    </div>
    <div class="sidebar-footer"><a href="../home.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Exit</a></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Users & Customers</h1><p>All registered users and their account details</p></div>
      <div id="user-count" style="font-size:14px; font-weight:700; color:var(--primary);">—</div>
    </div>
    <div class="filter-bar">
      <input type="text" class="search-input" id="search-input" placeholder="Search by name or email...">
    </div>
    <!-- Users Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Joined Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr class="empty-row"><td colspan="6">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Mobile Dock (Bottom Navigation) -->
  <nav class="mobile-dock">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Home</span>
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
      <span>Orders</span>
    </a>
    <a href="packages.html">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span>Pkgs</span>
    </a>
    <a href="users.html" class="active">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
      <span>Users</span>
    </a>
    <a href="settings.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script type="module">
    import { getAdminUser } from '../firebase-auth.js';
    import { db } from '../firebase-config.js';
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { escapeHTML } from '../utils.js';

    const admin = getAdminUser();
    if (!admin) window.location.href = 'login.html';

    let allUsers = [];

    onSnapshot(collection(db, 'users'), (snapshot) => {
      allUsers = [];
      snapshot.forEach(d => allUsers.push({ id: d.id, ...d.data() }));
      allUsers.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      document.getElementById('user-count').textContent = `${allUsers.length} Users`;
      renderUsers();
    }, () => {
      document.getElementById('users-tbody').innerHTML = '<tr class="empty-row"><td colspan="4">Unable to load users.</td></tr>';
    });

    document.getElementById('search-input').addEventListener('input', () => renderUsers());

    function renderUsers() {
      const q = document.getElementById('search-input').value.toLowerCase();
      let filtered = allUsers;
      if (q) filtered = filtered.filter(u => `${u.fullName || ''} ${u.email || ''}`.toLowerCase().includes(q));

      const tbody = document.getElementById('users-tbody');
      if (!filtered.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No users found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(u => {
        const initial = (u.fullName || 'U')[0].toUpperCase();
        const date = u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
        const role = u.role || 'user';
        return `<tr>
          <td><div class="user-row">
            ${u.photoURL ? `<img src="${u.photoURL}" class="user-avatar" alt="" onerror="this.outerHTML='<div class=user-avatar-fallback>${initial}</div>'">` : `<div class="user-avatar-fallback">${initial}</div>`}
            <strong>${escapeHTML(u.fullName || 'User')}</strong>
          </div></td>
          <td style="font-size:13px; color:var(--body);">${escapeHTML(u.email || '')}</td>
          <td><span class="badge badge-${role}">${role}</span></td>
          <td style="font-size:13px; color:var(--body);">${date}</td>
        </tr>`;
      }).join('');
    }
  </script>
</body>
</html>
