<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Packages Management — DollarRent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <style>
    :root {
      --bg: #F5F5F7; --card: rgba(255, 255, 255, 0.7); --border: rgba(226, 232, 240, 0.6);
      --primary: #0066CC; --primary-hover: #0055AA; --primary-glow: rgba(0, 102, 204, 0.1);
      --success: #34C759; --warning: #FF9500; --danger: #FF3B30;
      --heading: #1D1D1F; --body: #86868B;
      --radius: 24px; --radius-sm: 16px;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: var(--bg); color: var(--heading);
      display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { text-decoration: none; color: inherit; }

    /* ===== SIDEBAR (Desktop) / BOTTOM DOCK (Mobile) ===== */
    .sidebar {
      width: var(--sidebar-w); background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column;
      justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0;
      z-index: 100; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 36px; }
    .sidebar-brand img { width: 36px; height: 36px; filter: drop-shadow(0 4px 8px rgba(0,102,204,0.3)); }
    .sidebar-brand span { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .sidebar-brand span b { color: var(--primary); }

    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu a {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; color: var(--body); transition: all 0.25s ease;
    }
    .sidebar-menu a:hover { background: var(--primary-glow); color: var(--primary); transform: translateX(4px); }
    .sidebar-menu a.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(0,102,204,0.3); }
    .sidebar-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-footer { padding: 0 12px; }
    .sidebar-footer a { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--body); padding: 12px 0; }
    .sidebar-footer a:hover { color: var(--danger); }
    .sidebar-footer svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ===== MAIN ===== */
    .main { flex: 1; margin-left: var(--sidebar-w); padding: 40px 48px; overflow-y: auto; min-width: 0; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .page-header p { font-size: 15px; color: var(--body); margin-top: 4px; font-weight: 500; }

    .btn-add { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); background: var(--primary); color: white; box-shadow: 0 6px 16px rgba(0,102,204,0.25); }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,204,0.35); }
    .btn-add svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .pkg-card { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); transition: transform 0.3s ease; }
    .pkg-card:hover { transform: translateY(-4px); }
    .pkg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .pkg-amount { font-size: 36px; font-weight: 800; color: var(--heading); letter-spacing: -1px; }
    .pkg-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .pkg-badge.active { background: rgba(52,199,89,0.1); color: var(--success); }
    .pkg-badge.inactive { background: rgba(255,59,48,0.1); color: var(--danger); }
    
    .pkg-row { display: flex; justify-content: space-between; padding: 12px 0; font-size: 15px; border-bottom: 1px solid rgba(226,232,240,0.5); }
    .pkg-row:last-child { border-bottom: none; }
    .pkg-row .label { color: var(--body); }
    .pkg-row .value { font-weight: 700; }
    
    .pkg-actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn-edit { flex: 1; padding: 12px; background: var(--primary-glow); color: var(--primary); border: none; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-edit:hover { background: var(--primary); color: white; }
    .btn-toggle { flex: 1; padding: 12px; background: rgba(255,59,48,0.08); color: var(--danger); border: none; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-toggle:hover { background: rgba(255,59,48,0.15); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); backdrop-filter: blur(30px); border-radius: var(--radius); padding: 32px; width: 90%; max-width: 440px; box-shadow: 0 24px 48px -12px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--heading); }
    .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; outline: none; background: rgba(255,255,255,0.8); transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--primary); }
    .modal-btns { display: flex; gap: 12px; margin-top: 24px; }
    .modal-btns button { flex: 1; padding: 14px; border: none; border-radius: 30px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
    .btn-save { background: var(--primary); color: white; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,102,204,0.25); }
    .btn-cancel { background: rgba(0,0,0,0.05); color: var(--heading); }

    /* Mobile Dock */
    .mobile-dock { display: none; }

    @media (max-width: 1024px) {
      .main { padding: 32px; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 16px 100px; }
      .page-header h1 { font-size: 26px; }
      .grid { grid-template-columns: 1fr; }
      
      .mobile-dock {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 16px; left: 16px; right: 16px;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(229, 231, 235, 0.7); border-radius: 30px;
        padding: 10px 16px; z-index: 10000; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.15);
      }
      .mobile-dock a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--body); font-size: 10px; font-weight: 700; gap: 4px; flex: 1; transition: all 0.2s ease; }
      .mobile-dock a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; transition: all 0.3s; }
      .mobile-dock a.active { color: var(--primary); }
      .mobile-dock a.active svg { transform: translateY(-2px); stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(0,102,204,0.4)); }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><img src="../assets/logo.png" alt="DollarRent"><span>Dollar<b>Admin</b></span></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a></li>
        <li><a href="orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> Orders Queue</a></li>
        <li><a href="packages.html" class="active"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Packages</a></li>
        <li><a href="payment-methods.html"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg> Payment Methods</a></li>
        <li><a href="users.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> Users</a></li>
        <li><a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg> Settings</a></li>
      </ul>
    </div>
    <div class="sidebar-footer"><a href="../home.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Exit</a></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Packages & Fees</h1>
        <p>Manage rental packages available to customers</p>
      </div>
      <button class="btn-add" id="btn-add-pkg">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Package
      </button>
    </div>

    <div class="grid" id="packages-grid">
      <div style="text-align:center; padding:40px; color:var(--body); grid-column: 1/-1;">Loading packages...</div>
    </div>
  </main>

  <!-- Mobile Dock (Bottom Navigation) -->
  <nav class="mobile-dock">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Home</span>
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
      <span>Orders</span>
    </a>
    <a href="packages.html" class="active">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span>Pkgs</span>
    </a>
    <a href="users.html">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
      <span>Users</span>
    </a>
    <a href="settings.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="pkg-modal">
    <div class="modal">
      <h3 id="modal-title">Edit Package</h3>
      <div class="form-group"><label>Amount (USD)</label><input type="number" id="pkg-amount" placeholder="e.g. 50"></div>
      <div class="form-group"><label>Rental Fee (USD)</label><input type="number" id="pkg-fee" placeholder="e.g. 9"></div>
      <div class="form-group"><label>Processing Time</label><input type="text" id="pkg-time" placeholder="e.g. ~30 min"></div>
      <div class="form-group"><label>Availability Status</label><input type="text" id="pkg-avail" placeholder="e.g. Available"></div>
      <div class="modal-btns">
        <button class="btn-save" id="modal-save">Save</button>
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { getAdminUser, initAuthObserver } from '../firebase-auth.js';
    import { db } from '../firebase-config.js';
    import { collection, getDocs, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { DEFAULT_PACKAGES } from '../firestore.js';
    import { showToast, formatUSD } from '../utils.js';

    let packages = [];
    let editingId = null;
    let pkgUnsubscribe = null;

    initAuthObserver((user) => {
      const admin = getAdminUser();
      if (!admin && !user) {
        window.location.href = 'login.html';
        return;
      }

      // Real-time listener
      if (!pkgUnsubscribe) {
        const pkgRef = collection(db, 'packages');
        pkgUnsubscribe = onSnapshot(pkgRef, (snapshot) => {
          if (!snapshot.empty) {
            packages = [];
            snapshot.forEach(d => packages.push({ id: d.id, ...d.data() }));
            packages.sort((a, b) => (a.order || 0) - (b.order || 0));
          } else {
            packages = [];
          }
          renderPackages();
        }, (err) => {
          console.warn('Packages snapshot error:', err);
          packages = [];
          renderPackages();
        });
      }
    });

    function renderPackages() {
      const grid = document.getElementById('packages-grid');
      grid.innerHTML = packages.map(p => `
        <div class="pkg-card">
          <div class="pkg-header">
            <div class="pkg-amount">$${p.amount}</div>
            <span class="pkg-badge ${p.active !== false ? 'active' : 'inactive'}">${p.active !== false ? 'Active' : 'Inactive'}</span>
          </div>
          <div class="pkg-row"><span class="label">Rental Fee</span><span class="value">${formatUSD(p.fee)}</span></div>
          <div class="pkg-row"><span class="label">Processing</span><span class="value">${p.processingTime || '~30 min'}</span></div>
          <div class="pkg-row"><span class="label">Status</span><span class="value">${p.availability || 'Available'}</span></div>
          <div class="pkg-actions">
            <button class="btn-edit" onclick="window._editPkg('${p.id}')">Edit</button>
            <button class="btn-toggle" onclick="window._togglePkg('${p.id}', ${p.active !== false})">${p.active !== false ? 'Disable' : 'Enable'}</button>
          </div>
        </div>
      `).join('');
    }

    // Edit package
    window._editPkg = function(id) {
      const pkg = packages.find(p => p.id === id);
      if (!pkg) return;
      editingId = id;
      document.getElementById('modal-title').textContent = `Edit $${pkg.amount} Package`;
      document.getElementById('pkg-amount').value = pkg.amount;
      document.getElementById('pkg-fee').value = pkg.fee;
      document.getElementById('pkg-time').value = pkg.processingTime || '';
      document.getElementById('pkg-avail').value = pkg.availability || 'Available';
      document.getElementById('pkg-modal').classList.add('active');
    };

    // Toggle active
    window._togglePkg = async function(id, currentlyActive) {
      try {
        await updateDoc(doc(db, 'packages', id), { active: !currentlyActive });
        showToast(`Package ${currentlyActive ? 'disabled' : 'enabled'}!`, 'success');
      } catch (err) {
        showToast('Update failed: ' + err.message, 'error');
      }
    };

    // Add new
    document.getElementById('btn-add-pkg').addEventListener('click', () => {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Add New Package';
      document.getElementById('pkg-amount').value = '';
      document.getElementById('pkg-fee').value = '';
      document.getElementById('pkg-time').value = '';
      document.getElementById('pkg-avail').value = 'Available';
      document.getElementById('pkg-modal').classList.add('active');
    });

    // Save
    document.getElementById('modal-save').addEventListener('click', async () => {
      const data = {
        amount: parseInt(document.getElementById('pkg-amount').value) || 0,
        fee: parseInt(document.getElementById('pkg-fee').value) || 0,
        processingTime: document.getElementById('pkg-time').value || '~30 min',
        availability: document.getElementById('pkg-avail').value || 'Available',
        active: true,
        order: packages.length + 1
      };

      try {
        if (editingId) {
          await updateDoc(doc(db, 'packages', editingId), data);
          showToast('Package updated!', 'success');
        } else {
          const newId = 'p' + data.amount;
          await setDoc(doc(db, 'packages', newId), data);
          showToast('Package added!', 'success');
        }
        document.getElementById('pkg-modal').classList.remove('active');
      } catch (err) {
        showToast('Save failed: ' + err.message, 'error');
      }
    });

    document.getElementById('modal-cancel').addEventListener('click', () => {
      document.getElementById('pkg-modal').classList.remove('active');
    });
    document.getElementById('pkg-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
    });
  </script>
</body>
</html>
