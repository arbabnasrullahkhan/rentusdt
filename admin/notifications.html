<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>System Notifications — DollarRent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <style>
    :root { --bg: #F1F5F9; --card: #FFFFFF; --border: #E2E8F0; --primary: #0F62FE; --primary-glow: rgba(15,98,254,0.1); --success: #059669; --danger: #EF4444; --heading: #0B101E; --body: #64748B; --radius: 20px; --radius-sm: 12px; --shadow: 0 4px 24px -4px rgba(0,0,0,0.06); --sidebar-w: 260px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: var(--bg); color: var(--heading); display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    .sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 28px; }
    .sidebar-brand img { width: 32px; height: 32px; }
    .sidebar-brand span { font-size: 18px; font-weight: 800; }
    .sidebar-brand span b { color: var(--primary); }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .sidebar-menu a { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; color: var(--body); transition: all 0.2s; }
    .sidebar-menu a:hover, .sidebar-menu a.active { background: var(--primary-glow); color: var(--primary); }
    .sidebar-menu svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar-footer { padding: 0 8px; }
    .sidebar-footer a { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--body); }
    .sidebar-footer svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    .main { flex: 1; margin-left: var(--sidebar-w); padding: 28px 32px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .page-header h1 { font-size: 26px; font-weight: 800; }
    .page-header p { font-size: 14px; color: var(--body); }

    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .form-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn-send { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.25s; }
    .btn-send:hover { background: #0043CE; }

    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 700; color: var(--body); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 14px 12px; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
    tr:hover td { background: rgba(15,98,254,0.015); }
    .empty-row td { text-align: center; color: var(--body); padding: 40px; }

    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 20px 16px; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><img src="../assets/logo.png" alt="DollarRent"><span>Dollar<b>Admin</b></span></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a></li>
        <li><a href="orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> Orders</a></li>
        <li><a href="packages.html"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Packages</a></li>
        <li><a href="payment-methods.html"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect></svg> Payments</a></li>
        <li><a href="users.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> Users</a></li>
        <li><a href="notifications.html" class="active"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> Notifications</a></li>
        <li><a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg> Settings</a></li>
      </ul>
    </div>
    <div class="sidebar-footer"><a href="../home.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Exit</a></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Notifications</h1><p>Send system alerts to all users</p></div>
    </div>

    <div class="form-card">
      <h3>Send Global Notification</h3>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="n-title" placeholder="e.g. System Maintenance">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="n-message" placeholder="Notification content..."></textarea>
      </div>
      <button class="btn-send" id="btn-send">Send to All Users</button>
    </div>

    <div class="table-card">
      <h3>Recent Global Notifications</h3>
      <table style="margin-top:16px;">
        <thead><tr><th>Title</th><th>Message</th><th>Date</th></tr></thead>
        <tbody id="notif-tbody"><tr class="empty-row"><td colspan="3">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { getAdminUser } from '../firebase-auth.js';
    import { db } from '../firebase-config.js';
    import { collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { showToast, escapeHTML } from '../utils.js';

    const admin = getAdminUser();
    if (!admin) window.location.href = 'login.html';

    // Send Notification
    document.getElementById('btn-send').addEventListener('click', async () => {
      const btn = document.getElementById('btn-send');
      const title = document.getElementById('n-title').value.trim();
      const message = document.getElementById('n-message').value.trim();
      if (!title || !message) return showToast('Please fill all fields', 'warning');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await addDoc(collection(db, 'notifications'), {
          userId: 'GLOBAL',
          title,
          message,
          type: 'system',
          read: false,
          createdAt: new Date().toISOString()
        });
        showToast('Notification sent to all users!', 'success');
        document.getElementById('n-title').value = '';
        document.getElementById('n-message').value = '';
      } catch (err) {
        showToast('Failed to send: ' + err.message, 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Send to All Users';
    });

    // Load recent global notifications
    const q = query(collection(db, 'notifications'), where('userId', '==', 'GLOBAL'));
    onSnapshot(q, (snapshot) => {
      const notifs = [];
      snapshot.forEach(doc => notifs.push(doc.data()));
      notifs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const tbody = document.getElementById('notif-tbody');
      if (notifs.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="3">No global notifications sent.</td></tr>';
        return;
      }

      tbody.innerHTML = notifs.map(n => `
        <tr>
          <td><strong>${escapeHTML(n.title)}</strong></td>
          <td style="color:var(--body);">${escapeHTML(n.message)}</td>
          <td style="font-size:13px; color:var(--body);">${new Date(n.createdAt).toLocaleDateString()}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
