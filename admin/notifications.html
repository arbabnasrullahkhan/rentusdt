<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>System Notifications — DollarRent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <style>
    :root {
      --bg: #F5F5F7; --card: rgba(255, 255, 255, 0.7); --border: rgba(226, 232, 240, 0.6);
      --primary: #0066CC; --primary-hover: #0055AA; --primary-glow: rgba(0, 102, 204, 0.1);
      --success: #34C759; --warning: #FF9500; --danger: #FF3B30;
      --heading: #1D1D1F; --body: #86868B;
      --radius: 24px; --radius-sm: 16px;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: var(--bg); color: var(--heading);
      display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { text-decoration: none; color: inherit; }

    /* ===== SIDEBAR (Desktop) / BOTTOM DOCK (Mobile) ===== */
    .sidebar {
      width: var(--sidebar-w); background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column;
      justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0;
      z-index: 100; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 36px; }
    .sidebar-brand img { width: 36px; height: 36px; filter: drop-shadow(0 4px 8px rgba(0,102,204,0.3)); }
    .sidebar-brand span { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .sidebar-brand span b { color: var(--primary); }

    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu a {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; color: var(--body); transition: all 0.25s ease;
    }
    .sidebar-menu a:hover { background: var(--primary-glow); color: var(--primary); transform: translateX(4px); }
    .sidebar-menu a.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(0,102,204,0.3); }
    .sidebar-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-footer { padding: 0 12px; }
    .sidebar-footer a { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--body); padding: 12px 0; }
    .sidebar-footer a:hover { color: var(--danger); }
    .sidebar-footer svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ===== MAIN ===== */
    .main { flex: 1; margin-left: var(--sidebar-w); padding: 40px 48px; overflow-y: auto; min-width: 0; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .page-header p { font-size: 15px; color: var(--body); margin-top: 4px; font-weight: 500; }
    
    .btn-send { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); background: var(--primary); color: white; box-shadow: 0 6px 16px rgba(0,102,204,0.25); }
    .btn-send:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,204,0.35); }
    .btn-send svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    .notifications-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; max-width: 1000px; }
    .compose-card, .history-card { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); }
    
    .card-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--heading); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; outline: none; background: rgba(255,255,255,0.8); transition: border-color 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 120px; }
    
    .history-list { display: flex; flex-direction: column; gap: 12px; }
    .history-item { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: rgba(255,255,255,0.5); }
    .history-item h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .history-item p { font-size: 14px; color: var(--body); }
    .history-meta { font-size: 12px; color: var(--body); margin-top: 8px; display: flex; justify-content: space-between; }

    /* Mobile Dock */
    .mobile-dock { display: none; }

    @media (max-width: 1024px) {
      .main { padding: 32px; }
      .notifications-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 16px 100px; }
      .page-header h1 { font-size: 26px; }
      .compose-card, .history-card { padding: 20px; }
      
      .mobile-dock {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 16px; left: 16px; right: 16px;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(229, 231, 235, 0.7); border-radius: 30px;
        padding: 10px 16px; z-index: 10000; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.15);
      }
      .mobile-dock a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--body); font-size: 10px; font-weight: 700; gap: 4px; flex: 1; transition: all 0.2s ease; }
      .mobile-dock a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; transition: all 0.3s; }
      .mobile-dock a.active { color: var(--primary); }
      .mobile-dock a.active svg { transform: translateY(-2px); stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(0,102,204,0.4)); }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><img src="../assets/logo.png" alt="DollarRent"><span>Dollar<b>Admin</b></span></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a></li>
        <li><a href="orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> Orders</a></li>
        <li><a href="packages.html"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Packages</a></li>
        <li><a href="users.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> Users</a></li>
        <li><a href="notifications.html" class="active"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> Notifications</a></li>
        <li><a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg> Settings</a></li>
      </ul>
    </div>
    <div class="sidebar-footer"><a href="../home.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Exit</a></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>Notifications</h1><p>Send system alerts to all users</p></div>
    </div>

    <div class="notifications-layout">
      <div class="compose-card">
        <h3 class="card-title">New Alert</h3>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="n-title" placeholder="Maintenance">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="n-message" placeholder="Describe the notification..."></textarea>
        </div>
        <button class="btn-send" id="btn-send">Send Notification</button>
      </div>

      <div class="history-card">
        <h3 class="card-title">Recent History</h3>
        <div class="history-list" id="notifications-history">
          <div style="text-align:center; padding:20px; color:var(--body);">Loading history...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile Dock (Bottom Navigation) -->
  <nav class="mobile-dock">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Home</span>
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
      <span>Orders</span>
    </a>
    <a href="packages.html">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span>Pkgs</span>
    </a>
    <a href="users.html">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
      <span>Users</span>
    </a>
    <a href="settings.html" class="active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script type="module">
    import { initAuthObserver, getAdminUser } from '../firebase-auth.js';
    import { db } from '../firebase-config.js';
    import { collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { showToast, escapeHTML } from '../utils.js';

    let currentAdmin = null;
    let notifsUnsubscribe = null;

    initAuthObserver((user) => {
      const adminUser = getAdminUser();
      if (!adminUser && !user) {
        window.location.href = 'login.html';
        return;
      }
      currentAdmin = adminUser || user;

      if (!notifsUnsubscribe) {
        const q = query(collection(db, 'notifications'), where('userId', '==', 'GLOBAL'));
        notifsUnsubscribe = onSnapshot(q, (snapshot) => {
          const notifs = [];
          snapshot.forEach(doc => notifs.push(doc.data()));
          notifs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

          const historyDiv = document.getElementById('notifications-history');
          if (notifs.length === 0) {
            historyDiv.innerHTML = '<div style="text-align:center; padding:20px; color:var(--body);">No global notifications sent.</div>';
            return;
          }

          historyDiv.innerHTML = notifs.map(n => `
            <div class="history-item">
              <h4>${escapeHTML(n.title)}</h4>
              <p>${escapeHTML(n.message)}</p>
              <div class="history-meta">
                <span>Global Alert</span>
                <span>${new Date(n.createdAt).toLocaleDateString()}</span>
              </div>
            </div>
          `).join('');
        });
      }
    });

    // Send Notification
    document.getElementById('btn-send').addEventListener('click', async () => {
      const btn = document.getElementById('btn-send');
      const title = document.getElementById('n-title').value.trim();
      const message = document.getElementById('n-message').value.trim();
      if (!title || !message) return showToast('Please fill all fields', 'warning');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await addDoc(collection(db, 'notifications'), {
          userId: 'GLOBAL',
          title,
          message,
          type: 'system',
          read: false,
          createdAt: new Date().toISOString()
        });
        showToast('Notification sent to all users!', 'success');
        document.getElementById('n-title').value = '';
        document.getElementById('n-message').value = '';
      } catch (err) {
        showToast('Failed to send: ' + err.message, 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Send Notification';
    });


  </script>
</body>
</html>
