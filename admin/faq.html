<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAQ Management — DollarRent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <style>
    :root {
      --bg: #F5F5F7; --card: rgba(255, 255, 255, 0.7); --border: rgba(226, 232, 240, 0.6);
      --primary: #0066CC; --primary-hover: #0055AA; --primary-glow: rgba(0, 102, 204, 0.1);
      --success: #34C759; --warning: #FF9500; --danger: #FF3B30;
      --heading: #1D1D1F; --body: #86868B;
      --radius: 24px; --radius-sm: 16px;
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: var(--bg); color: var(--heading);
      display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { text-decoration: none; color: inherit; }

    /* ===== SIDEBAR (Desktop) / BOTTOM DOCK (Mobile) ===== */
    .sidebar {
      width: var(--sidebar-w); background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--border); padding: 32px 20px; display: flex; flex-direction: column;
      justify-content: space-between; position: fixed; top: 0; bottom: 0; left: 0;
      z-index: 100; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 36px; }
    .sidebar-brand img { width: 36px; height: 36px; filter: drop-shadow(0 4px 8px rgba(0,102,204,0.3)); }
    .sidebar-brand span { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .sidebar-brand span b { color: var(--primary); }

    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu a {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; color: var(--body); transition: all 0.25s ease;
    }
    .sidebar-menu a:hover { background: var(--primary-glow); color: var(--primary); transform: translateX(4px); }
    .sidebar-menu a.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(0,102,204,0.3); }
    .sidebar-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-footer { padding: 0 12px; }
    .sidebar-footer a { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--body); padding: 12px 0; }
    .sidebar-footer a:hover { color: var(--danger); }
    .sidebar-footer svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ===== MAIN ===== */
    .main { flex: 1; margin-left: var(--sidebar-w); padding: 40px 48px; overflow-y: auto; min-width: 0; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .page-header p { font-size: 15px; color: var(--body); margin-top: 4px; font-weight: 500; }
    
    .btn-add { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); background: var(--primary); color: white; box-shadow: 0 6px 16px rgba(0,102,204,0.25); }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,204,0.35); }
    .btn-add svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    .faq-list { display: flex; flex-direction: column; gap: 16px; max-width: 900px; }
    .faq-item { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 24px; box-shadow: var(--shadow); }
    .faq-item h4 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
    .faq-item p { font-size: 15px; color: var(--body); line-height: 1.6; }
    .faq-actions { display: flex; gap: 12px; margin-top: 16px; }
    .faq-actions button { padding: 8px 16px; border-radius: 30px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-edit { background: var(--primary-glow); color: var(--primary); }
    .btn-edit:hover { background: var(--primary); color: white; }
    .btn-delete { background: rgba(255,59,48,0.1); color: var(--danger); }
    .btn-delete:hover { background: rgba(255,59,48,0.2); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); backdrop-filter: blur(30px); border-radius: var(--radius); padding: 32px; width: 90%; max-width: 520px; box-shadow: 0 24px 48px -12px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--heading); }
    .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; outline: none; background: rgba(255,255,255,0.8); transition: border-color 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 100px; }
    
    .modal-btns { display: flex; gap: 12px; margin-top: 24px; }
    .modal-btns button { flex: 1; padding: 14px; border: none; border-radius: 30px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
    .btn-save { background: var(--primary); color: white; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,102,204,0.25); }
    .btn-cancel { background: rgba(0,0,0,0.05); color: var(--heading); }

    /* Mobile Dock */
    .mobile-dock { display: none; }

    @media (max-width: 1024px) {
      .main { padding: 32px; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 16px 100px; }
      .page-header h1 { font-size: 26px; }
      
      .mobile-dock {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 16px; left: 16px; right: 16px;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(229, 231, 235, 0.7); border-radius: 30px;
        padding: 10px 16px; z-index: 10000; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.15);
      }
      .mobile-dock a { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--body); font-size: 10px; font-weight: 700; gap: 4px; flex: 1; transition: all 0.2s ease; }
      .mobile-dock a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; transition: all 0.3s; }
      .mobile-dock a.active { color: var(--primary); }
      .mobile-dock a.active svg { transform: translateY(-2px); stroke-width: 2.5; filter: drop-shadow(0 2px 4px rgba(0,102,204,0.4)); }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><img src="../assets/logo.png" alt="DollarRent"><span>Dollar<b>Admin</b></span></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a></li>
        <li><a href="orders.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> Orders</a></li>
        <li><a href="packages.html"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Packages</a></li>
        <li><a href="settings.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg> Settings</a></li>
        <li><a href="faq.html" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> FAQs</a></li>
      </ul>
    </div>
    <div class="sidebar-footer"><a href="../home.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Exit</a></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div><h1>FAQ Management</h1><p>Add or edit frequently asked questions</p></div>
      <button class="btn-add" id="btn-add-faq"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Add FAQ</button>
    </div>

    <div class="faq-list" id="faq-list">
      <div style="text-align:center; padding:40px; color:var(--body);">Loading FAQs...</div>
    </div>
  </main>

  <!-- Mobile Dock (Bottom Navigation) -->
  <nav class="mobile-dock">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Home</span>
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
      <span>Orders</span>
    </a>
    <a href="packages.html">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span>Pkgs</span>
    </a>
    <a href="users.html">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
      <span>Users</span>
    </a>
    <a href="settings.html" class="active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div class="modal-overlay" id="faq-modal">
    <div class="modal">
      <h3 id="modal-title">Edit FAQ</h3>
      <div class="form-group"><label>Question</label><input type="text" id="f-question" placeholder="e.g. How does it work?"></div>
      <div class="form-group"><label>Answer</label><textarea id="f-answer" placeholder="Detailed answer here..."></textarea></div>
      <div class="form-group"><label>Display Order (Lower = First)</label><input type="number" id="f-order" placeholder="e.g. 1"></div>
      <div class="modal-btns">
        <button class="btn-save" id="modal-save">Save</button>
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { getAdminUser } from '../firebase-auth.js';
    import { db } from '../firebase-config.js';
    import { collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { showToast, escapeHTML } from '../utils.js';

    const admin = getAdminUser();
    if (!admin) window.location.href = 'login.html';

    let faqs = [];
    let editingId = null;

    onSnapshot(collection(db, 'faqs'), (snapshot) => {
      faqs = [];
      snapshot.forEach(d => faqs.push({ id: d.id, ...d.data() }));
      faqs.sort((a, b) => (a.order || 0) - (b.order || 0));
      renderFaqs();
    });

    function renderFaqs() {
      const tbody = document.getElementById('faq-tbody');
      if (!faqs.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No FAQs added yet.</td></tr>';
        return;
      }
      tbody.innerHTML = faqs.map(f => `
        <tr>
          <td><strong>${escapeHTML(f.question)}</strong></td>
          <td style="color:var(--body); max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(f.answer)}</td>
          <td>${f.order || 0}</td>
          <td>
            <button class="action-btn" onclick="window._editFaq('${f.id}')">Edit</button>
            <button class="action-btn action-delete" onclick="window._deleteFaq('${f.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    window._editFaq = (id) => {
      const f = faqs.find(x => x.id === id);
      if (!f) return;
      editingId = id;
      document.getElementById('modal-title').textContent = 'Edit FAQ';
      document.getElementById('f-question').value = f.question;
      document.getElementById('f-answer').value = f.answer;
      document.getElementById('f-order').value = f.order || 0;
      document.getElementById('faq-modal').classList.add('active');
    };

    window._deleteFaq = async (id) => {
      if (!confirm('Delete this FAQ?')) return;
      try {
        await deleteDoc(doc(db, 'faqs', id));
        showToast('FAQ deleted', 'success');
      } catch (err) { showToast('Error: ' + err.message, 'error'); }
    };

    document.getElementById('btn-add-faq').addEventListener('click', () => {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Add New FAQ';
      document.getElementById('f-question').value = '';
      document.getElementById('f-answer').value = '';
      document.getElementById('f-order').value = faqs.length + 1;
      document.getElementById('faq-modal').classList.add('active');
    });

    document.getElementById('modal-save').addEventListener('click', async () => {
      const id = editingId || 'f' + Date.now();
      const data = {
        question: document.getElementById('f-question').value,
        answer: document.getElementById('f-answer').value,
        order: parseInt(document.getElementById('f-order').value) || 0,
        active: true
      };
      if(!data.question || !data.answer) return showToast('Please fill all fields', 'warning');

      try {
        await setDoc(doc(db, 'faqs', id), data);
        showToast('FAQ saved!', 'success');
        document.getElementById('faq-modal').classList.remove('active');
      } catch (err) { showToast('Save failed: ' + err.message, 'error'); }
    });

    document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('faq-modal').classList.remove('active'));
    document.getElementById('faq-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); });
  </script>
</body>
</html>
