<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KYC & Order Details — DollarRent</title>
  <meta name="description" content="Secure KYC verification for your digital USD rental.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --bg-color: #F8FAFC; --card-solid: #FFFFFF; --border-color: #E2E8F0; --primary: #0F62FE; --heading: #0B101E; --body: #64748B; --radius-lg: 24px; --radius-md: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: var(--bg-color); color: var(--heading); padding-bottom: 100px; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    
    .navbar { position: fixed; top: 0; left: 0; right: 0; height: 72px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226,232,240,0.8); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
    .nav-brand img { width: 32px; height: 32px; }
    
    .container { max-width: 680px; margin: 100px auto 32px; padding: 0 20px; }
    .page-header { text-align: center; margin-bottom: 28px; }
    .page-header h1 { font-size: 26px; font-weight: 800; }
    .page-header p { font-size: 14px; color: var(--body); margin-top: 6px; }

    .form-card { background: var(--card-solid); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px 28px; box-shadow: 0 4px 24px -4px rgba(0,0,0,0.06); }
    .form-section-title { font-size: 15px; font-weight: 700; color: var(--heading); margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 1px solid rgba(226,232,240,0.6); }
    .form-section-title:first-child { margin-top: 0; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .form-group.full { grid-column: 1 / -1; }
    
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); font-size: 14px; outline: none; background: #F8FAFC; transition: all 0.2s; font-family: inherit; }
    .form-input:focus { border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 4px rgba(15,98,254,0.1); }
    
    .upload-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 600px) { .upload-grid { grid-template-columns: repeat(3, 1fr); } }
    .upload-box { border: 2px dashed var(--border-color); border-radius: var(--radius-md); padding: 20px 16px; text-align: center; background: #F8FAFC; cursor: pointer; transition: all 0.2s; }
    .upload-box:hover { border-color: var(--primary); background: #F0F6FF; }
    .upload-box svg { width: 24px; height: 24px; stroke: var(--primary); fill: none; stroke-width: 2; margin-bottom: 8px; }
    .upload-box-title { font-size: 12px; font-weight: 700; }
    .preview-img { width: 100%; height: 90px; border-radius: 8px; object-fit: cover; margin-top: 10px; display: none; }
    
    .btn-submit { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--primary); color: white; font-size: 16px; font-weight: 700; border: none; cursor: pointer; margin-top: 28px; box-shadow: 0 8px 24px rgba(15,98,254,0.25); transition: all 0.25s; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(15,98,254,0.35); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="nav-brand">
      <img src="assets/logo.png" alt="DollarRent"> DollarRent
    </a>
    <a href="javascript:history.back()" style="font-size:14px; font-weight:600; color:var(--body);">Cancel</a>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>KYC & Order Details</h1>
      <p>Secure identity verification for your rental</p>
    </div>

    <div class="form-card">
      <form id="kyc-order-form">
        
        <div class="form-section-title">1. Personal Information</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>Full Name (as per ID)</label>
            <input type="text" id="fullName" class="form-input" placeholder="e.g. Ali Khan" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="ali@example.com" required readonly>
          </div>
          <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="+92 300 1234567" required>
          </div>
          <div class="form-group full">
            <label>Complete Address (City, Country)</label>
            <input type="text" id="location" class="form-input" placeholder="e.g. Lahore, Pakistan" required>
          </div>
        </div>

        <div class="form-section-title">2. Receiving Wallet / Platform</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>Select Platform</label>
            <select id="deliveryPlatform" class="form-input" required style="appearance:none;">
              <option value="Binance Pay">Binance Pay</option>
              <option value="USDT TRC20 Wallet">USDT TRC20 Wallet</option>
              <option value="USDT BEP20 Wallet">USDT BEP20 Wallet</option>
              <option value="Quotex Account">Quotex Account</option>
              <option value="MetaTrader 5">MetaTrader 5</option>
              <option value="Other Exchange">Other Exchange</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Binance UID / Wallet Address</label>
            <input type="text" id="binanceUid" class="form-input" placeholder="e.g. 284910293 or T..." required>
          </div>
        </div>

        <div class="form-section-title">3. Identity Verification</div>
        <div class="upload-grid">
          <div class="upload-box" onclick="document.getElementById('selfieFile').click()">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path></svg>
            <div class="upload-box-title">Live Selfie *</div>
            <input type="file" id="selfieFile" accept="image/*" capture="user" style="display:none;" required>
            <img id="selfie-prev" class="preview-img">
          </div>
          <div class="upload-box" onclick="document.getElementById('cnicFrontFile').click()">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <div class="upload-box-title">ID Front *</div>
            <input type="file" id="cnicFrontFile" accept="image/*" style="display:none;" required>
            <img id="cnic-front-prev" class="preview-img">
          </div>
          <div class="upload-box" onclick="document.getElementById('cnicBackFile').click()">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <div class="upload-box-title">ID Back *</div>
            <input type="file" id="cnicBackFile" accept="image/*" style="display:none;" required>
            <img id="cnic-back-prev" class="preview-img">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-proceed">Proceed to Checkout →</button>
      </form>
    </div>
  </main>

  <script type="module">
    import './app.js';
    import { getCurrentUser } from './firebase-auth.js';
    import { compressAndConvertImage, showToast } from './utils.js';

    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount') || '50';
    const fee = params.get('fee') || '9';
    const packageId = params.get('packageId') || 'p50';

    const user = getCurrentUser();
    if (!user) {
      window.location.href = 'index.html';
    } else {
      if (user.fullName) document.getElementById('fullName').value = user.fullName;
      if (user.email) document.getElementById('email').value = user.email;
    }

    let selfieBase64 = '', frontBase64 = '', backBase64 = '';

    function attachUploader(inputId, prevId, setter) {
      document.getElementById(inputId).addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const b64 = await compressAndConvertImage(file);
            setter(b64);
            document.getElementById(prevId).src = b64;
            document.getElementById(prevId).style.display = 'block';
          } catch(err) {
            showToast(err.message, 'error');
          }
        }
      });
    }

    attachUploader('selfieFile', 'selfie-prev', (b) => selfieBase64 = b);
    attachUploader('cnicFrontFile', 'cnic-front-prev', (b) => frontBase64 = b);
    attachUploader('cnicBackFile', 'cnic-back-prev', (b) => backBase64 = b);

    document.getElementById('kyc-order-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!selfieBase64 || !frontBase64 || !backBase64) {
        return showToast('All 3 KYC images are required for processing.', 'warning');
      }

      const orderDraft = {
        customer: {
          fullName: document.getElementById('fullName').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          location: document.getElementById('location').value.trim(),
          deliveryPlatform: document.getElementById('deliveryPlatform').value,
          binanceUid: document.getElementById('binanceUid').value.trim(),
          kyc: {
            selfieUrl: selfieBase64,
            cnicFrontUrl: frontBase64,
            cnicBackUrl: backBase64
          }
        }
      };

      sessionStorage.setItem('dollarrent_pending_order', JSON.stringify(orderDraft));
      window.location.href = `checkout.html?packageId=${packageId}&amount=${amount}&fee=${fee}`;
    });
  </script>
</body>
</html>
