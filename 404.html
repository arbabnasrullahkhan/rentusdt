<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — Page Not Found | DollarRent</title>
  
  <meta name="description" content="The page you are looking for does not exist. Return to DollarRent homepage.">
  <link rel="canonical" href="https://dollarrent.vercel.app/404.html">

  <!-- STRICT LOGO COMPLIANCE -->
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- ================= PREMIUM FINTECH CSS ================= -->
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-solid: rgba(255, 255, 255, 0.88);
      --border-color: rgba(226, 232, 240, 0.9);
      --primary: #0F62FE;
      --primary-hover: #0043CE;
      --primary-glow: rgba(15, 98, 254, 0.15);
      --secondary: #00E676;
      --heading: #0B101E;
      --body: #475569;
      --radius-lg: 32px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 24px 48px -12px rgba(15, 98, 254, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      /* Dynamic Ambient Grid Background */
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(15, 98, 254, 0.06) 0%, transparent 60%), 
        radial-gradient(circle at 50% 100%, rgba(0, 230, 118, 0.05) 0%, transparent 50%),
        linear-gradient(rgba(15, 98, 254, 0.03) 1px, transparent 1px), 
        linear-gradient(90deg, rgba(15, 98, 254, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= MAIN CONTAINER ================= */
    .container {
      max-width: 520px; width: 100%;
      text-align: center;
      z-index: 10;
    }

    /* ================= FLOATING GLASS CARD ================= */
    .error-card {
      background: var(--card-solid);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 52px 36px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      animation: floatCard 6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Top glowing accent bar */
    .error-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
      background-size: 200% 100%;
      animation: gradientMove 3s linear infinite;
    }
    @keyframes gradientMove { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }

    /* ================= STAGGERED ENTRANCE ANIMATIONS ================= */
    .anim-item {
      opacity: 0;
      transform: translateY(20px);
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
    .delay-5 { animation-delay: 0.5s; }

    @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

    /* ================= TRIPLE RADAR PULSE ICON ================= */
    .radar-icon {
      position: relative; width: 88px; height: 88px; margin: 0 auto 28px;
      background: var(--primary-glow); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .radar-icon svg { width: 44px; height: 44px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; z-index: 2; }
    
    /* Staggered Sonar Rings */
    .radar-pulse {
      position: absolute; width: 100%; height: 100%;
      border-radius: 50%; border: 2px solid var(--primary);
      opacity: 0; animation: radarScan 2.8s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }
    .pulse-2 { animation-delay: 0.9s; }
    .pulse-3 { animation-delay: 1.8s; }

    @keyframes radarScan {
      0% { transform: scale(0.9); opacity: 0.8; border-color: var(--primary); }
      100% { transform: scale(2.2); opacity: 0; border-color: var(--secondary); }
    }

    /* ================= SHIMMERING 404 TYPOGRAPHY ================= */
    .error-code {
      font-size: 110px; font-weight: 900;
      line-height: 0.95; margin-bottom: 12px; letter-spacing: -4px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, #4A8BFF 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineText 4s linear infinite;
      filter: drop-shadow(0 12px 20px rgba(15, 98, 254, 0.2));
    }

    @keyframes shineText {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    
    h1 { font-size: 28px; font-weight: 800; color: var(--heading); margin-bottom: 10px; letter-spacing: -0.8px; }
    p { font-size: 15px; color: var(--body); margin-bottom: 36px; line-height: 1.6; font-weight: 500; }

    /* ================= BUTTONS ================= */
    .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 16px 30px; border-radius: 30px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; font-size: 15px; font-weight: 800; text-decoration: none;
      box-shadow: 0 10px 24px rgba(15,98,254,0.3); border: none; cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(15,98,254,0.4); }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 16px 30px; border-radius: 30px; background: #FFFFFF;
      color: var(--heading); font-size: 15px; font-weight: 800; text-decoration: none;
      border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-sm); }

    .btn-primary svg, .btn-secondary svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 480px) {
      .error-card { padding: 40px 20px; }
      .actions { flex-direction: column; }
      .btn-primary, .btn-secondary { width: 100%; }
      .error-code { font-size: 92px; }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="error-card">
      
      <!-- Triple Sonar Radar Pulse -->
      <div class="radar-icon anim-item delay-1">
        <div class="radar-pulse"></div>
        <div class="radar-pulse pulse-2"></div>
        <div class="radar-pulse pulse-3"></div>
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>

      <!-- Shimmering Code & Titles -->
      <div class="error-code anim-item delay-2">404</div>
      <h1 class="anim-item delay-3">Page Not Found</h1>
      <p class="anim-item delay-4">The page you're looking for doesn't exist, has been moved, or is temporarily offline. Let's get you back on track.</p>
      
      <!-- Buttons -->
      <div class="actions anim-item delay-5">
        <a href="home.html" class="btn-primary">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Home
        </a>
        <a href="https://t.me/rental_dollor" target="_blank" class="btn-secondary">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          Support
        </a>
      </div>

    </div>
  </main>

  <!-- ================= FIREBASE & APP.JS INJECTION ================= -->
  <!-- app.js handles the Floating Island Header and Mobile Dock for seamless navigation -->
  <script type="module">
    import './app.js';
  </script>
</body>
</html>
