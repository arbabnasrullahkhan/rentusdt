<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | DollarRent</title>
  <meta name="description" content="The page you are looking for does not exist. Return to DollarRent homepage.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: #F8FAFC;
      color: #0B101E;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 440px; width: 100%; text-align: center;
      opacity: 0; transform: translateY(20px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .error-code {
      font-size: 120px; font-weight: 900;
      background: linear-gradient(135deg, #0F62FE, #4A8BFF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1; margin-bottom: 8px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 15px; color: #64748B; margin-bottom: 28px; line-height: 1.6; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #0F62FE, #0043CE);
      color: white; border-radius: 14px;
      font-size: 15px; font-weight: 700; text-decoration: none;
      box-shadow: 0 8px 20px rgba(15,98,254,0.25);
      transition: all 0.25s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,98,254,0.35); }
    .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="home.html" class="btn">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Back to Home
    </a>
  </div>
</body>
</html>
