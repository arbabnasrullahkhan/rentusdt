<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — Page Not Found | DollarRent</title>
  
  <meta name="description" content="The page you are looking for does not exist. Return to DollarRent homepage.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- ================= PREMIUM FINTECH CSS ================= -->
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-solid: #FFFFFF;
      --border-color: #E2E8F0;
      --primary: #0F62FE;
      --primary-hover: #0043CE;
      --primary-glow: rgba(15, 98, 254, 0.12);
      --heading: #0B101E;
      --body: #475569;
      --radius-lg: 32px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 20px 40px -8px rgba(15, 98, 254, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      /* Premium Grid Background */
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%), 
                        linear-gradient(rgba(15, 98, 254, 0.03) 1px, transparent 1px), 
                        linear-gradient(90deg, rgba(15, 98, 254, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; -webkit-font-smoothing: antialiased;
    }

    /* ================= MAIN CONTAINER ================= */
    .container {
      max-width: 500px; width: 100%;
      text-align: center;
      z-index: 10;
    }

    /* ================= ERROR CARD ================= */
    .error-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: var(--shadow-md);
      opacity: 0; transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ================= ANIMATED RADAR ICON ================= */
    .radar-icon {
      position: relative; width: 80px; height: 80px; margin: 0 auto 24px;
      background: var(--primary-glow); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .radar-icon svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; z-index: 2; }
    
    .radar-pulse {
      position: absolute; width: 100%; height: 100%;
      border-radius: 50%; border: 2px solid var(--primary);
      opacity: 0; animation: radarScan 2s infinite ease-out;
    }
    @keyframes radarScan {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* ================= TYPOGRAPHY ================= */
    .error-code {
      font-size: 110px; font-weight: 900;
      background: linear-gradient(135deg, var(--primary), #00E676);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1; margin-bottom: 12px; letter-spacing: -4px;
      filter: drop-shadow(0 10px 15px rgba(15, 98, 254, 0.2));
    }
    
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
    p { font-size: 15px; color: var(--body); margin-bottom: 36px; line-height: 1.6; font-weight: 500; }

    /* ================= ACTION BUTTONS ================= */
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 30px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; font-size: 15px; font-weight: 700; text-decoration: none;
      box-shadow: 0 8px 20px rgba(15,98,254,0.25); border: none; cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(15,98,254,0.35); }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 30px; background: var(--card-solid);
      color: var(--heading); font-size: 15px; font-weight: 700; text-decoration: none;
      border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-3px); }

    .btn-primary svg, .btn-secondary svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 480px) {
      .actions { flex-direction: column; }
      .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
      .error-code { font-size: 90px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="error-card">
      
      <!-- Animated Radar / Search Graphic -->
      <div class="radar-icon">
        <div class="radar-pulse"></div>
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>

      <!-- 404 Text -->
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist, has been moved, or you don't have access. Let's get you back on track.</p>
      
      <!-- Buttons -->
      <div class="actions">
        <a href="home.html" class="btn-primary">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Home
        </a>
        <a href="https://t.me/rental_dollor" target="_blank" class="btn-secondary">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          Support
        </a>
      </div>

    </div>
  </div>

  <!-- ================= FIREBASE & APP.JS INJECTION ================= -->
  <!-- app.js handles the Floating Header and Mobile Dock so the user can easily navigate away -->
  <script type="module">
    import './app.js';
  </script>
</body>
</html>
