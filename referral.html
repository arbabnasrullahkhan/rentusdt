<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Referral Program — DollarRent</title>
  <meta name="description" content="Earn rewards by referring friends to DollarRent. Share your unique referral link and track your earnings.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #F8FAFC; --card-solid: #FFFFFF; --border-color: #E2E8F0;
      --primary: #0F62FE; --primary-glow: rgba(15,98,254,0.12);
      --success: #059669; --warning: #D97706; --heading: #0B101E; --body: #64748B;
      --radius-lg: 24px; --radius-md: 16px; --radius-sm: 12px;
      --shadow-card: 0 4px 24px -4px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%),
        linear-gradient(rgba(15,98,254,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,98,254,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--heading); padding-bottom: 100px; -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 680px; margin: 0 auto; padding: 32px 20px; }

    .animate-in { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 26px; font-weight: 800; }
    .page-header p { font-size: 14px; color: var(--body); margin-top: 4px; }

    /* Hero Banner */
    .referral-hero {
      background: linear-gradient(135deg, var(--primary) 0%, #4A8BFF 100%);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      color: white;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .referral-hero::before {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .referral-hero h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; position: relative; z-index: 1; }
    .referral-hero p { font-size: 14px; opacity: 0.85; line-height: 1.6; position: relative; z-index: 1; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 14px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .stat-value { font-size: 24px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--body); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    /* Referral Link */
    .link-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }
    .link-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .link-card h3 svg { width: 18px; height: 18px; stroke: var(--primary); fill: none; stroke-width: 2; }
    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .link-input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      color: var(--heading);
      background: var(--bg-color);
      outline: none;
    }
    .btn-copy {
      padding: 12px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .btn-copy:hover { background: #0043CE; }
    .share-row { display: flex; gap: 10px; margin-top: 14px; }
    .share-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
    }
    .share-btn svg { width: 16px; height: 16px; }
    .share-whatsapp { background: rgba(37,211,102,0.1); color: #25D366; }
    .share-telegram { background: rgba(0,136,204,0.1); color: #0088cc; }
    .share-whatsapp:hover { background: rgba(37,211,102,0.2); }
    .share-telegram:hover { background: rgba(0,136,204,0.2); }

    /* How It Works */
    .how-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }
    .how-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(226,232,240,0.5);
    }
    .step:last-child { border-bottom: none; }
    .step-num {
      width: 32px; height: 32px;
      background: var(--primary-glow);
      color: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; flex-shrink: 0;
    }
    .step-text h4 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .step-text p { font-size: 13px; color: var(--body); line-height: 1.5; }

    /* Recent Referrals */
    .recent-card {
      background: var(--card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
    }
    .recent-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    .referral-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(226,232,240,0.5);
    }
    .referral-item:last-child { border-bottom: none; }
    .referral-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary-glow);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .referral-info { flex: 1; }
    .referral-name { font-size: 14px; font-weight: 700; }
    .referral-date { font-size: 12px; color: var(--body); }
    .referral-reward { font-size: 14px; font-weight: 800; color: var(--success); }

    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-state svg { width: 48px; height: 48px; stroke: #CBD5E1; fill: none; stroke-width: 1.5; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; color: var(--body); }

    /* Not logged in */
    .login-prompt { text-align: center; padding: 60px 20px; }
    .login-prompt h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .login-prompt p { font-size: 14px; color: var(--body); margin-bottom: 24px; }
    .btn-login {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 28px; background: var(--primary); color: white;
      border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 20px rgba(15,98,254,0.25);
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-value { font-size: 20px; }
      .share-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <main class="container" id="referral-container">
    <div class="page-header animate-in">
      <h1>Referral Program</h1>
      <p>Invite friends and earn rewards on every successful rental</p>
    </div>
    <div id="referral-content">
      <div style="text-align:center; padding:20px; color:var(--body); font-size:14px;">Loading...</div>
    </div>
  </main>

  <script type="module">
    import './app.js';
    import { getCurrentUser, loginWithGoogle } from './firebase-auth.js';
    import { db } from './firebase-config.js';
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { copyToClipboard, showToast, escapeHTML } from './utils.js';

    const content = document.getElementById('referral-content');

    function getRefCode(user) {
      // Generate a unique referral code from UID
      return 'DR-' + (user.uid || '').substring(0, 8).toUpperCase();
    }

    async function renderReferralPage() {
      const user = getCurrentUser();

      if (!user) {
        content.innerHTML = `
          <div class="login-prompt animate-in delay-1">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <h2>Sign In to Access Referrals</h2>
            <p>Sign in to get your unique referral link and start earning.</p>
            <button id="btn-login-ref" class="btn-login">Sign In with Google</button>
          </div>
        `;
        document.getElementById('btn-login-ref')?.addEventListener('click', async () => {
          try { await loginWithGoogle(); renderReferralPage(); } catch {}
        });
        return;
      }

      const refCode = getRefCode(user);
      const refLink = `${window.location.origin}/home.html?ref=${refCode}`;

      // Try to fetch referral settings
      let rewardAmount = 'a discount';
      try {
        const settingsRef = doc(db, 'admin_settings', 'referral');
        const settingsSnap = await getDoc(settingsRef);
        if (settingsSnap.exists()) {
          const data = settingsSnap.data();
          if (data.rewardAmount) rewardAmount = `$${data.rewardAmount} off`;
        }
      } catch {}

      // Fetch referral stats
      let referralCount = 0;
      let referralList = [];
      try {
        const refRef = collection(db, 'referrals');
        const q = query(refRef, where('referrerUid', '==', user.uid));
        const snap = await getDocs(q);
        referralCount = snap.size;
        snap.forEach(doc => referralList.push({ id: doc.id, ...doc.data() }));
      } catch {}

      content.innerHTML = `
        <div class="referral-hero animate-in delay-1">
          <h2>Earn ${escapeHTML(rewardAmount)} Per Referral!</h2>
          <p>Share your unique link with friends. When they complete a rental, you both earn rewards.</p>
        </div>

        <div class="stats-grid animate-in delay-1">
          <div class="stat-card">
            <div class="stat-value">${referralCount}</div>
            <div class="stat-label">Referrals</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--success);">${referralList.filter(r => r.status === 'completed').length}</div>
            <div class="stat-label">Successful</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--warning);">${referralList.filter(r => r.status === 'pending').length}</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>

        <div class="link-card animate-in delay-2">
          <h3>
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Your Referral Link
          </h3>
          <div class="link-row">
            <input type="text" class="link-input" id="ref-link" value="${refLink}" readonly>
            <button class="btn-copy" id="btn-copy-link">Copy</button>
          </div>
          <div class="share-row">
            <button class="share-btn share-whatsapp" id="share-wa">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
              WhatsApp
            </button>
            <button class="share-btn share-telegram" id="share-tg">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
              Telegram
            </button>
          </div>
        </div>

        <div class="how-card animate-in delay-3">
          <h3>How It Works</h3>
          <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">
              <h4>Share Your Link</h4>
              <p>Copy your unique referral link and send it to friends, family, or social media.</p>
            </div>
          </div>
          <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">
              <h4>Friend Signs Up & Rents</h4>
              <p>When your friend uses your link and completes their first rental order, the referral is tracked.</p>
            </div>
          </div>
          <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">
              <h4>Both Get Rewarded</h4>
              <p>You and your friend both receive ${escapeHTML(rewardAmount)} on your next rental. Rewards are applied automatically.</p>
            </div>
          </div>
        </div>

        <div class="recent-card animate-in delay-4">
          <h3>Your Referrals</h3>
          <div id="referral-list"></div>
        </div>
      `;

      // Referral list rendering
      const listEl = document.getElementById('referral-list');
      if (referralList.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <p>No referrals yet. Share your link to get started!</p>
          </div>
        `;
      } else {
        listEl.innerHTML = referralList.map(r => {
          const initial = (r.referredName || 'U')[0].toUpperCase();
          const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
          return `
            <div class="referral-item">
              <div class="referral-avatar">${initial}</div>
              <div class="referral-info">
                <div class="referral-name">${escapeHTML(r.referredName || 'User')}</div>
                <div class="referral-date">${date} · ${r.status || 'pending'}</div>
              </div>
              <div class="referral-reward">${r.status === 'completed' ? '+Reward' : 'Pending'}</div>
            </div>
          `;
        }).join('');
      }

      // Bind buttons
      document.getElementById('btn-copy-link')?.addEventListener('click', () => {
        copyToClipboard(refLink, 'Referral link copied!');
      });

      document.getElementById('share-wa')?.addEventListener('click', () => {
        const text = encodeURIComponent(`Hey! Check out DollarRent for digital USD rentals. Use my link: ${refLink}`);
        window.open(`https://wa.me/?text=${text}`, '_blank');
      });

      document.getElementById('share-tg')?.addEventListener('click', () => {
        const text = encodeURIComponent(`Hey! Rent digital USD easily with DollarRent: ${refLink}`);
        window.open(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${text}`, '_blank');
      });
    }

    renderReferralPage();
  </script>
</body>
</html>
